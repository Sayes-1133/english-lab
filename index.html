hat lift up communities and support good-paying jobs, while also ensuring future generations have a livable planet.", "answer": ["robust"], "chinese": "这个风能项目及全国其他类似项目将创造强劲且可持续的经济，帮助社区发展、提供高薪工作，同时确保后代拥有宜居的地球。"}, {"id": "U4B-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "In a report earlier this year, the panel said that a tariff rate that is too low can __________ countries to lower their rate to remain competitive.", "answer": ["incentivize"], "chinese": "该委员会在今年早些时候的一份报告中表示，过低的关税税率可能促使各国为保持竞争力而进一步降低税率。"}, {"id": "U4B-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "More money will be packed into the future self-driving cars, making semiconductors (半导体) a growth opportunity in a car industry struggling with stagnant sales.", "answer": "更多资金将涌入未来自动驾驶汽车的研发中，使半导体成为汽车行业的增长机会，这个行业目前正因停滞的销量而苦苦挣扎。"}, {"id": "U4B-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "Professors can create a template and have all students use the same template so that all assignments have a consistent appearance.", "answer": "教授可以创建一个让所有学生使用的模板，这样所有的作业都能保持一致的样式。"}, {"id": "U4B-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "The world will experience a record drop in greenhouse gas emissions this year, but it will be barely perceptible in the atmosphere, according to an analysis recently released.", "answer": "根据近期发布的一项分析，今年全球温室气体排放量将出现创纪录的下降，但从大气中几乎察觉不到。"}, {"id": "U4B-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "In all of these studies, this linked-health phenomenon was frequently found in couples who were genetically dissimilar, coinciding with what has been found in many other previous studies.", "answer": "在所有这些研究中，经常发现在基因不同的夫妇身上出现了这种健康关联的现象，这与之前许多其他研究的发现是一致的。"}], "notes": [{"page": 5, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n01\nOne of the more recent models of change was created by Dr. John Kotter\n(1995) and is an eight-step approach to change management, a more\nrobust template for change that business leaders can follow to build a\ndetailed plan. (Para. 4)\n此句由and连接两个并列分句。第二个分句中，a more robust template\nfor change作an eight-step approach to change management的同位语，\nthat引导定语从句修饰template。"}, {"page": 6, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n02\nYet one of the principal reasons for the high failure rate of change\nmanagement strategies is the lack of understanding that systems and\npeople go hand in hand. (Para. 7)\n此句是主系表结构。表语lack后面的of understanding …是后置定语，\nthat引导的从句作understanding的同位语，说明understanding的具体\n内容。"}, {"page": 7, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n03\nEventually, there will be gradual acceptance as he starts to find his feet\nwithin the new environment and becomes more skilled at using the\nsoftware. (Para. 8)\nfind one’s feet: to become confident in a new situation, esp. one that is\ndifficult at first 习惯新的环境（尤指起初困难的环境）\nMy sister didn’t know anyone in England when she got there, but quickly she\nfound her feet. 我姐姐到达伦敦时，她谁也不认识，但很快就适应了。"}, {"page": 8, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n04\nFisher’s model provides businesses with a comprehensive and solid\nunderstanding of how much of an impact change may have on employees\nacross the board. (Para. 9)\nacross the board: if sth. happens or is done across the board, it affects\neveryone in a particular group, place, etc. 全体地，包括一切地\nReforming the pricing of medical services isn’t intended to cut prices\nacross the board, but it’s part of a broader adjustment in healthcare that\nhas already tackled excessive profits for drugs and medical supplies. 医疗\n服务的价格改革并不是为了全面降价，而是作为医疗行业更广泛调整\n的一部分，该调整已经解决了药品和医疗用品利润过高的问题。"}]}];
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={blank:'选词填空',meaning:'中文词义',translation:'英译汉',passage:'课文逐段翻译'};
const isTranslation=q=>q.type==='translation'||q.type==='passage';
const all=DATA.flatMap(u=>[...u.questions.map(q=>({...q,unit:u.id})),...u.vocab.map((v,i)=>({id:`${u.id}-meaning-${i}`,unit:u.id,type:'meaning',number:i+1,page:1,prompt:v.word,answer:v.meaning}))]);
const byId=Object.fromEntries(all.map(q=>[q.id,q]));
const shuffle=list=>{let a=[...list];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
const isCorrect=(q,a)=>q.type==='blank'?q.answer.some(v=>normalize(v)===normalize(a)):q.answer===a;
const answerText=q=>Array.isArray(q.answer)?q.answer.join(' / '):q.answer;
// 把题目要求的变形还原到词库中的基本形式，供反馈页查询释义。
const answerRoots={'U2A-blank-2':'regenerate','U2A-blank-3':'emission','U3A-blank-2':'elapse','U3B-blank-2':'intervene','U3B-blank-3':'rationality','U3B-blank-8':'trim','U4A-blank-4':'allocate','U4A-blank-8':'rebound'};
const meaningsByUnit=Object.fromEntries(DATA.map(unit=>{
  const meanings=new Map(unit.vocab.map(v=>[normalize(v.word),v.meaning]));
  meanings.set('rationality','理性');
  for(const q of unit.questions.filter(q=>q.type==='blank')){
    const root=answerRoots[q.id]||q.answer[0];
    const meaning=meanings.get(normalize(root));
    if(meaning)for(const form of q.answer)meanings.set(normalize(form),meaning);
  }
  return [unit.id,meanings];
}));

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#crumb').textContent=({home:'开始练习',quiz:'正在考核',result:'考核结果',wrong:'错题本',library:'学习资料',history:'练习记录'})[view];({home,quiz,result,wrong,library,history})[view]();save()}
function selectedPool(){return all.filter(q=>chosenUnits.has(q.unit)&&chosenTypes.has(q.type))}
function home(){let s=state.session;$('#main').innerHTML=heading('YOUR DAILY ENGLISH','把知识，练成自己的。','从填空、词义、英译汉和课文逐段翻译中组卷。每题提交后都能查看反馈。')+`<div class="stats four"><div><b>62</b><span>选词填空原题</span></div><div><b>62</b><span>中文词义考核</span></div><div><b>35</b><span>英译汉原题</span></div><div><b>20</b><span>课文段落翻译</span></div></div>${s?`<div class="resume"><div><strong>${s.finished?'查看上次结果':'有一份尚未完成的练习'}</strong><p>${s.ids.length} 题 · 已反馈 ${Object.keys(s.checked).length} 题</p></div><button id="resume">${s.finished?'查看结果':'继续答题'} →</button></div>`:''}<section class="panel"><div class="section-head"><h2>01 <span>选择学习单元</span></h2><button class="link-button" id="selectAll">全选 / 清空</button></div><div class="unit-grid">${DATA.map(u=>`<button class="unit ${chosenUnits.has(u.id)?'selected':''}" data-unit="${u.id}"><strong>${u.id}<em>${chosenUnits.has(u.id)?'✓':'＋'}</em></strong><small>${({U1:'气候与水资源',U2:'城市与人口',U3:'行为与成长',U4:'发展与变革'})[u.id.slice(0,2)]}</small><span>${u.questions.filter(q=>q.type==='blank').length} 填空 · ${u.vocab.length} 词义 · ${u.questions.filter(q=>q.type==='translation').length} 翻译 · ${u.questions.filter(q=>q.type==='passage').length} 课文</span></button>`).join('')}</div><div class="section-head second"><h2>02 <span>设置练习方式</span></h2></div><div class="settings"><div><label class="field-label">题型（可多选）</label><div class="check-row">${Object.entries(labels).map(([k,v])=>`<label><input type="checkbox" data-type="${k}" ${chosenTypes.has(k)?'checked':''}> ${v}</label>`).join('')}</div></div><div><label class="field-label" for="count">本轮题量</label><select id="count"><option value="20">随机 20 题</option><option value="10">随机 10 题</option><option value="40">随机 40 题</option><option value="all">全部题目</option></select></div></div><div class="start-row"><p id="poolInfo"></p><button class="primary" id="start">开始考核 →</button></div><p class="hint">填空不区分大小写，需按语境变形；英译汉与课文翻译对照参考译文自评。</p></section>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{chosenUnits.has(b.dataset.unit)?chosenUnits.delete(b.dataset.unit):chosenUnits.add(b.dataset.unit);home()});$('#selectAll').onclick=()=>{chosenUnits=chosenUnits.size===8?new Set():new Set(DATA.map(u=>u.id));home()};document.querySelectorAll('[data-type]').forEach(b=>b.onchange=()=>{b.checked?chosenTypes.add(b.dataset.type):chosenTypes.delete(b.dataset.type);poolInfo()});$('#start').onclick=()=>{let pool=selectedPool(),n=$('#count').value;if(pool.length)start(n==='all'?pool:shuffle(pool).slice(0,+n))};if(s)$('#resume').onclick=()=>{view=s.finished?'result':'quiz';render()};poolInfo()}
function poolInfo(){$('#poolInfo').textContent=`已选 ${chosenUnits.size} 份材料 · 可练习 ${selectedPool().length} 题`;$('#start').disabled=!selectedPool().length}
function start(qs){if(state.session&&!state.session.finished&&!confirm('开始新练习会替换尚未完成的一轮，确定继续吗？'))return;let options={};for(const q of qs.filter(q=>q.type==='meaning')){let distractors=shuffle([...new Set(all.filter(v=>v.type==='meaning'&&v.answer!==q.answer).map(v=>v.answer))]).slice(0,3);options[q.id]=shuffle([q.answer,...distractors])}state.session={ids:qs.map(q=>q.id),answers:{},checked:{},self:{},options,index:0,started:Date.now(),finished:false};view='quiz';render()}
function score(s){let auto=s.ids.filter(id=>!isTranslation(byId[id])),trans=s.ids.filter(id=>isTranslation(byId[id]));return{auto:auto.length,correct:auto.filter(id=>s.checked[id]&&isCorrect(byId[id],s.answers[id])).length,trans:trans.length,pending:trans.filter(id=>s.self[id]===undefined).length}}
function grade(id){let s=state.session,q=byId[id];if(s.checked[id])return;if(!String(s.answers[id]||'').trim()){alert('先完成这一题，再查看反馈。');return}s.checked[id]=true;if(!isTranslation(q))setWrong(id,!isCorrect(q,s.answers[id]));save();quiz()}
function selfGrade(id,v){let s=state.session;s.self[id]=v;setWrong(id,v<2);save();quiz()}
function feedback(q,s){if(!s.checked[q.id])return '';const a=s.answers[q.id],translation=isTranslation(q),good=translation?s.self[q.id]===2:isCorrect(q,a);return `<section class="feedback ${translation?'neutral':good?'correct':'incorrect'}" aria-live="polite"><div class="feedback-title">${translation?'参考译文与自评':good?'✓ 回答正确':'✕ 需要复习'}</div>${q.type==='blank'?`<p><b>你的答案：</b>${escapeHTML(a)} <span class="meaning">中文释义：${escapeHTML(wordMeaning(q,a))}</span></p><p><b>正确答案：</b>${escapeHTML(answerText(q))} <span class="meaning">中文释义：${escapeHTML(wordMeaning(q,q.answer[0]))}</span></p><p><b>题目翻译：</b>${escapeHTML(q.chinese)}</p>`:q.type==='meaning'?`<p><b>${escapeHTML(q.prompt)}：</b>${escapeHTML(q.answer)}</p>`:`<p><b>${q.type==='passage'?'参考译文（供自评）':'参考译文'}：</b>${escapeHTML(q.answer)}</p><p class="hint">请按意思准确、信息完整、表达通顺来评价自己的译文。</p><div class="self-buttons">${['需复习','部分掌握','已掌握'].map((t,i)=>`<button data-self="${i}" class="${s.self[q.id]===i?'chosen':''}">${i} · ${t}</button>`).join('')}</div>`}${q.type==='blank'&&formNotes[q.id]?`<p class="hint"><b>词形提示：</b>${escapeHTML(formNotes[q.id])}</p>`:''}</section>`}
function quiz(){let s=state.session;if(!s){view='home';return render()}if(s.finished){view='result';return render()}let q=byId[s.ids[s.index]],done=Object.keys(s.checked).length,checked=!!s.checked[q.id];$('#main').innerHTML=`<div class="quiz-top"><button class="link-button" id="leave">← 保存并返回</button><span>${q.unit} · ${labels[q.type]}</span></div><div class="quiz-layout"><section class="panel question-panel"><div class="question-meta"><span class="tag">${labels[q.type]}</span><span>第 ${s.index+1} / ${s.ids.length} 题</span></div><div class="progress"><i style="width:${done/s.ids.length*100}%"></i></div><p class="instruction">${q.type==='blank'?'从词库中选词，按句意填入适当形式。':q.type==='meaning'?'选择词语的中文含义；选择后立即显示结果。':q.type==='passage'?'翻译这一整段课文，然后查看参考译文并自评。':'写下中文译文，然后查看 参考译文并自评。'}</p>${q.type==='blank'?`<div class="bank">${DATA.find(u=>u.id===q.unit).vocab.map(v=>`<span>${escapeHTML(v.word)}</span>`).join('')}</div>`:''}${q.type==='passage'?`<div class="passage-context">${escapeHTML(q.passageTitle)} · 第 ${q.number} 段${q.section?` · ${escapeHTML(q.section)}`:''}</div>`:''}<div class="prompt ${q.type==='meaning'?'word-prompt':q.type==='passage'?'passage-prompt':''}">${escapeHTML(q.prompt).replace(/_{2,}/g,'<span class="blank">________</span>')}</div>${q.type==='meaning'?`<div class="options">${s.options[q.id].map((v,i)=>`<button class="option ${s.answers[q.id]===v?'chosen':''}" data-option="${escapeHTML(v)}" ${checked?'disabled':''}><b>${'ABCD'[i]}</b>${escapeHTML(v)}</button>`).join('')}</div>`:`<label class="field-label" for="answer">${q.type==='blank'?'你的答案':'你的译文'}</label>${q.type==='blank'?`<input id="answer" class="answer" autocomplete="off" spellcheck="false" placeholder="输入单词或短语…" value="${escapeHTML(s.answers[q.id]||'')}" ${checked?'disabled':''}>`:`<textarea id="answer" class="answer" rows="${q.type==='passage'?10:5}" placeholder="${q.type==='passage'?'在这里写下这一段的中文翻译…':'在这里写下你的中文翻译…'}" ${checked?'disabled':''}>${escapeHTML(s.answers[q.id]||'')}</textarea>`}${!checked?`<button class="primary check-button" id="grade">${q.type==='blank'?'提交本题':'查看参考译文'}</button>`:''}`}<div id="feedback">${feedback(q,s)}</div><div class="source">来源：${escapeHTML(q.source||q.unit+'.pdf')} · ${q.type==='meaning'?'第 1–2 页词库 · 补充词义考核':q.type==='passage'?`第 ${q.page} 页 · 课文第 ${q.number} 段`:`第 ${q.page} 页 · 原题 ${q.number}`}</div><div class="question-actions"><button id="prev" ${s.index===0?'disabled':''}>← 上一题</button>${s.index===s.ids.length-1?'<button class="primary" id="finish">完成本轮 →</button>':'<button class="primary" id="next" '+(!checked?'disabled':'')+'>下一题 →</button>'}</div></section><section class="panel navigator"><h3>答题卡</h3><p>${done} / ${s.ids.length} 已查看反馈</p><div class="question-grid">${s.ids.map((id,i)=>`<button data-index="${i}" class="${i===s.index?'current':''} ${s.checked[id]?'filled':''}">${i+1}</button>`).join('')}</div><p class="hint">绿色为已查看反馈。</p><button id="end" class="end">结束并查看总览</button></section></div>`;$('#leave').onclick=()=>{view='home';render()};$('#prev').onclick=()=>{s.index--;render()};const next=$('#next');if(next)next.onclick=()=>{s.index++;render()};const finish=$('#finish');if(finish)finish.onclick=finishSession;$('#end').onclick=finishSession;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{s.index=+b.dataset.index;render()});if(q.type==='meaning')document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{s.answers[q.id]=b.dataset.option;grade(q.id)});else if(!checked){$('#answer').oninput=e=>{s.answers[q.id]=e.target.value;save()};$('#grade').onclick=()=>grade(q.id);if(q.type==='blank')$('#answer').onkeydown=e=>{if(e.key==='Enter')grade(q.id)}}document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>selfGrade(q.id,+b.dataset.self))}
function finishSession(){let s=state.session,remaining=s.ids.filter(id=>!s.checked[id]);if(remaining.length&&!confirm(`还有 ${remaining.length} 题未查看反馈。现在结束吗？这些题会计为未完成。`))return;s.finished=true;s.ended=Date.now();writeHistory();view='result';render()}
function writeHistory(){let s=state.session,m=score(s);let entry={started:s.started,ended:s.ended,total:s.ids.length,auto:m.auto,correct:m.correct,trans:m.trans,pending:m.pending};state.history=[entry,...state.history.filter(h=>h.started!==s.started)].slice(0,40);save()}
function result(){let s=state.session;if(!s){view='home';return render()}let m=score(s);$('#main').innerHTML=heading('PRACTICE REPORT','每一题，都是一步进展。','客观题按已提交的答案判分；英译汉按逐题自评记录。')+`<div class="stats"><div><b>${m.auto?Math.round(m.correct/m.auto*100)+'%':'—'}</b><span>客观题 ${m.correct}/${m.auto}</span></div><div><b>${Object.keys(s.checked).length}</b><span>已查看反馈 / ${s.ids.length} 题</span></div><div><b>${m.pending}</b><span>翻译待自评</span></div></div><div class="report-actions"><button class="primary" id="retry">重练错题</button><button id="back">返回首页</button></div><div class="results">${s.ids.map((id,i)=>{let q=byId[id],a=s.answers[id]||'',graded=!!s.checked[id],correct=graded&&!isTranslation(q)&&isCorrect(q,a),wrong=graded&&(isTranslation(q)?s.self[id]!==undefined&&s.self[id]<2:!correct),passed=graded&&(isTranslation(q)?s.self[id]===2:correct);return `<article class="panel result-card${wrong?' wrong':''}"><div class="result-head"><span>${i+1}. ${q.unit} · ${labels[q.type]}</span><strong class="${passed?'good':wrong?'bad':''}">${!graded?'未完成':isTranslation(q)?(['需复习','部分掌握','已掌握'][s.self[id]]||'待自评'):correct?'正确':'需复习'}</strong></div>${q.type==='passage'?`<p class="passage-context">${escapeHTML(q.passageTitle)} · 第 ${q.number} 段</p>`:''}<p class="result-prompt ${q.type==='passage'?'passage-result':''}">${escapeHTML(q.prompt)}</p><div class="result-box"><small>你的答案</small><p>${escapeHTML(a||'（未作答）')}</p></div><div class="result-box ref"><small>${q.type==='passage'?'参考译文（供自评）':q.type==='translation'?'参考译文':'正确答案'}</small><p>${escapeHTML(answerText(q))}</p></div>${q.type==='blank'?`<div class="result-box ref"><small>你的答案的中文释义</small><p>${escapeHTML(wordMeaning(q,a))}</p><small>正确答案的中文释义</small><p>${escapeHTML(wordMeaning(q,q.answer[0]))}</p><small>题目翻译</small><p>${escapeHTML(q.chinese)}</p>${formNotes[q.id]?`<small>词形提示</small><p>${escapeHTML(formNotes[q.id])}</p>`:''}</div>`:''}</article>`}).join('')}</div>`;$('#back').onclick=()=>{view='home';render()};$('#retry').onclick=()=>{let qs=s.ids.filter(id=>state.wrong.includes(id)).map(id=>byId[id]);qs.length?start(qs):alert('这轮没有已判定的错题。')}}
function wrong(){let qs=state.wrong.map(id=>byId[id]).filter(Boolean);$('#main').innerHTML=heading('REVIEW & REMEMBER','错题本','答错的填空和词义题，以及自评未掌握的英译汉与课文翻译会出现在这里。')+`<section class="panel"><div class="section-head"><h2>待复习 <span>${qs.length} 题</span></h2>${qs.length?'<button class="primary" id="review">开始错题练习 →</button>':''}</div>${qs.length?qs.map(q=>`<div class="list-row"><span class="tag">${q.unit} · ${labels[q.type]}</span><p>${escapeHTML(q.prompt)}</p>${q.type==='blank'?`<small>翻译：${escapeHTML(q.chinese)}</small>`:''}</div>`).join(''):'<div class="empty">还没有错题。<p>完成一轮练习后，在这里巩固薄弱知识。</p></div>'}</section>`;if(qs.length)$('#review').onclick=()=>start(shuffle(qs))}
function revealText(text,label){return `<details class="masked-text"><summary><span class="closed-label">点击显示${label}</span><span class="open-label">点击收起${label}</span></summary><p>${escapeHTML(text)}</p></details>`}
function library(){
  $('#main').innerHTML=heading('REFERENCE DESK','学习资料','先查词库，再复习英译汉原题和课文翻译。英文原文直接显示；点击遮盖处查看中文译文或词语释义。')+DATA.map(u=>{
    const passages=u.questions.filter(q=>q.type==='passage');
    const translations=u.questions.filter(q=>q.type==='translation');
    return `<details class="panel material"><summary>${u.id} <small>${u.vocab.length} 个词语 · ${translations.length} 道英译汉${passages.length?' · '+passages.length+' 段课文':''}</small></summary>
      <h3 class="material-subhead">词库</h3><div class="vocab-grid">${u.vocab.map(v=>`<div class="vocab-entry"><b>${escapeHTML(v.word)}</b>${revealText(v.meaning,'中文释义')}</div>`).join('')}</div>
      <section class="translation-library"><h3 class="material-subhead">英译汉原题 · ${translations.length} 题</h3>${translations.map(q=>`<article class="translation-study"><div class="translation-study-head"><b>第 ${q.number} 题</b><small>来源：${u.id}.pdf · 第 ${q.page} 页</small></div><div class="bilingual"><div class="passage-original"><b>英文题目</b><p>${escapeHTML(q.prompt)}</p></div><div class="passage-translation"><b>参考译文</b>${revealText(q.answer,'参考译文')}</div></div></article>`).join('')}</section>
      ${passages.length?`<section class="passage-library"><h3>${escapeHTML(passages[0].passageTitle)} · 课文原文与翻译</h3><p class="hint">按段落展开对照阅读。中文译文是补充参考，并非教材官方译文。</p>${passages.map(q=>`<details class="passage-entry"><summary>第 ${q.number} 段${q.section?` <span class="passage-subtitle">${escapeHTML(q.section)}</span>`:''}</summary><div class="bilingual"><div class="passage-original"><b>英文原文</b><p>${escapeHTML(q.prompt)}</p></div><div class="passage-translation"><b>参考译文</b>${revealText(q.answer,'参考译文')}</div><small>来源：${escapeHTML(q.source)} · 第 ${q.page} 页</small></div></details>`).join('')}</section>`:''}

    </details>`
  }).join('')
}

function history(){$('#main').innerHTML=heading('YOUR LEARNING TRAIL','练习记录','记录只保存在当前浏览器，最多保留最近 40 次。')+`<section class="panel">${state.history.length?state.history.map(h=>`<div class="history-row"><div><strong>${new Date(h.ended).toLocaleString('zh-CN')}</strong><p>${h.total} 题 · 翻译 ${h.trans} 题${h.pending?` · ${h.pending} 题待自评`:''}</p></div><b>${h.auto?Math.round(h.correct/h.auto*100)+'%':'—'}<small>客观题 ${h.correct}/${h.auto}</small></b></div>`).join(''):'<div class="empty">还没有练习记录。<p>完成第一次考核，留下你的学习足迹。</p></div>'}</section>`}
layout();render();
</script></body></html>
