</style></head><body><noscript>请启用 JavaScript 以进行考核。</noscript><script>const DATA=[{"id": "U1A", "vocab": [{"word": "metabolic", "meaning": "新陈代谢的"}, {"word": "finite", "meaning": "有限的"}, {"word": "erosion", "meaning": "侵蚀；流失"}, {"word": "counteract", "meaning": "抵消；对抗"}, {"word": "unprecedented", "meaning": "前所未有的"}, {"word": "thermal", "meaning": "热的；热量的"}, {"word": "skeptical", "meaning": "怀疑的"}, {"word": "prolong", "meaning": "延长"}], "questions": [{"id": "U1A-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "Research suggests that our planet is warming at a(n) ____________ pace.", "answer": ["unprecedented"], "chinese": "研究表明，我们的星球正以前所未有的速度变暖。"}, {"id": "U1A-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "Your __________ rate is the speed at which your body transforms food into energy.", "answer": ["metabolic"], "chinese": "你的新陈代谢速度是身体将食物转化为能量的速度。"}, {"id": "U1A-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "The research team proposes a few key recommendations to __________ the declining of domestic demand.", "answer": ["counteract"], "chinese": "研究团队提出了几项关键建议，以应对国内需求下降。"}, {"id": "U1A-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "A(n) _________ management system optimizes battery range in high and low temperatures, allowing the car to maintain optimal range capability.", "answer": ["thermal"], "chinese": "热管理系统可在高温和低温条件下优化电池续航，使汽车保持最佳续航能力。"}, {"id": "U1A-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "By the 1920s, ___________ from winds and weather had removed a large part of the land.", "answer": ["erosion"], "chinese": "到20世纪20年代，风和天气造成的侵蚀已经带走了大片土地。"}, {"id": "U1A-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "It’s needless to say that the value of water, this _______ and irreplaceable resource, is enormous.", "answer": ["finite"], "chinese": "不用说，水这种有限且不可替代的资源价值巨大。"}, {"id": "U1A-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "Experts say the spread of the virus in countries with little protection from vaccines could lead to more variants and ___________ the pandemic.", "answer": ["prolong"], "chinese": "专家表示，在疫苗保护不足的国家，病毒传播可能产生更多变种，并延长这场大流行。"}, {"id": "U1A-blank-8", "type": "blank", "number": 8, "page": 2, "prompt": "Many people are still ___________ about artificial intelligence getting adopted by financial institutions.", "answer": ["skeptical"], "chinese": "许多人仍对金融机构采用人工智能持怀疑态度。"}, {"id": "U1A-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "A landmark new report on biodiversity and ecosystem was released in Paris on Monday, warning about the unprecedented declining rate of nature globally.", "answer": "周一，一份关于生物多样性和生态系统的里程碑式的新报告在巴黎发布，对全球自然界前所未有的衰退速度发出了警告。"}, {"id": "U1A-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "Soil erosion—the loss of fertile topsoil by water, wind, or tillage (耕作)— is a global problem, the consequences of which are becoming more widely noticed.", "answer": "土壤侵蚀是水、风以及耕作导致的肥沃表土流失，这已是全球性问题，其后果正受到越来越广泛的关注。"}, {"id": "U1A-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "If the right amount of the boat is submerged, the force of buoyancy (浮力) is strong enough to counteract gravity pulling the boat down, and the boat floats.", "answer": "如果适量的船体没入水中，强大的浮力足以抵消将船向下拉坠的重力，船就会漂浮起来。"}, {"id": "U1A-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "The tropics receive a great amount of direct solar energy, which produces more evaporation than higher latitudes.", "answer": "热带地区接收到大量太阳直射的能量，比高纬度地区产生更多的蒸发。"}, {"id": "U1A-passage-1", "type": "passage", "number": 1, "page": "1", "prompt": "Multiple studies published in peer-reviewed journals show that 97% of scientists agree that the effects of climate change are due to human activity. Yet in a recent survey conducted by a research center, less than 50% of US adults agree with the scientific consensus. So is this half of the population justifiably skeptical or does the research support the experts? To help you decide for yourself, we've used the latest evidence to address the big questions.", "answer": "多项发表于同行评审期刊的研究表明，97%的科学家认同气候变化的影响源于人类活动。然而，某研究中心最近的一项调查发现，认同这一科学共识的美国成年人还不到50%。那么，这一半人口的怀疑有合理依据吗？研究结果是否支持专家的看法？为了帮助你自行判断，我们运用最新证据来回答这些重要问题。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": ""}, {"id": "U1A-passage-2", "type": "passage", "number": 2, "page": "1", "prompt": "In short, yes. Since global temperature records began in the late 19th century, the planet's average surface temperature has risen by approximately 2.0°F (1.1°C), with 16 of the 17 hottest years on record occurring over the last 35 years. Eighty percent of this additional heat is absorbed by the world's oceans, the surface of which has increased in temperature by 0.13°F per decade since 1901 (NASA, n.d.).", "answer": "简而言之，有。自19世纪末开始记录全球气温以来，地球平均地表温度已上升约2.0华氏度（1.1摄氏度）；有记录以来最热的17年中，16年发生在过去35年。额外热量的80%被世界海洋吸收。自1901年以来，海洋表面温度每十年上升0.13华氏度（NASA，日期不详）。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q1 Is there any evidence for global warming?"}, {"id": "U1A-passage-3", "type": "passage", "number": 3, "page": "1", "prompt": "Yes. Changes in the Earth's climate are a natural and frequent phenomenon. Ice ages—driven by slow variations in the Earth's orbit that alter the distribution of the Sun's energy—have occurred, on average, every 100,000 years. These climatic events have led to mass extinction, the migration of populations, and dramatic changes in the landscape, so why is modern climate change such an issue? While ice ages are cyclical, the pace at which the planet has warmed since the end of the last ice age is unprecedented—making adaptation virtually impossible. According to the Royal Society, the increase in the Earth's temperature over the 7,000–18,000-year period since the end of the last ice age is approximately 4°C, 25% of which occurred in the last 200 years.", "answer": "是的。地球气候变化是一种自然且频繁发生的现象。冰期由地球轨道的缓慢变化驱动；这些变化改变了太阳能量的分布。冰期平均每十万年出现一次。这类气候事件曾导致物种大规模灭绝、人口迁移以及地貌剧变，那么现代气候变化为何如此令人担忧？冰期具有周期性，而自上一个冰期结束以来，地球变暖的速度却前所未有，使适应几乎不可能。据英国皇家学会估计，自上一个冰期结束后的七千至一万八千年间，地球温度上升了约4摄氏度，其中25%的升温发生在过去200年。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q2 Hasn't the Earth's climate always fluctuated?"}, {"id": "U1A-passage-4", "type": "passage", "number": 4, "page": "2", "prompt": "A blanket of greenhouse gases—carbon dioxide, water vapor, nitrous oxide, and methane—in the Earth's atmosphere absorb heat and warm the planet's surface, a natural phenomenon known as the greenhouse effect. Measurements of the atmosphere and air in ice indicate a 40% increase in CO2 levels in the 200-year period to 2012 (The Royal Society and the US National Academy of Sciences, 2014). This rapid increase is almost certainly a consequence of human activity. Over the last century, burning of finite resources such as coal and oil, deforestation for agriculture, and industrial expansion have all greatly increased the concentration of CO2 in the Earth's atmosphere. Increased levels of other greenhouse gases are also directly attributable to human activity. The cultivation of domestic livestock and the expansion of landfills have increased levels of methane, while nitrous oxide is largely generated by soil cultivation. The bottom line is that while the greenhouse effect is a natural phenomenon, its expansion (and global warming by extension) is largely due to human activity.", "answer": "地球大气层中覆盖着一层温室气体，包括二氧化碳、水蒸气、一氧化二氮和甲烷；它们吸收热量，使地表变暖。这种自然现象称为温室效应。对大气及冰中空气的测量表明，截至2012年的200年间，二氧化碳浓度增加了40%（英国皇家学会与美国国家科学院，2014）。这种迅速增长几乎可以肯定是人类活动造成的。上个世纪，燃烧煤炭、石油等有限资源，为农业砍伐森林，以及工业扩张，都大幅提高了大气中的二氧化碳浓度。其他温室气体浓度的上升也与人类活动直接相关。饲养家畜和扩大垃圾填埋场增加了甲烷含量，而一氧化二氮主要由耕种土壤产生。归根结底，温室效应虽然是自然现象，但它的增强，以及由此带来的全球变暖，在很大程度上是人类活动所致。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q3 Is human activity the primary cause?"}, {"id": "U1A-passage-5", "type": "passage", "number": 5, "page": "2–3", "prompt": "The Earth's oceans absorb about 80% of the additional heat generated by global warming. When water heats up, it expands, causing sea levels to rise. Over the past century, global sea levels have risen by four to eight inches (10 to 20 centimeters), and approximately 50% of this increase is directly attributable to thermal expansion. As with the greenhouse effect, this is a natural phenomenon. However, recent data suggests that over the past 20 years, sea levels have risen by 0.13 inches (3.3 millimeters) a year—roughly twice the speed of the preceding 80 years. Such a rapid increase can have devastating consequences for coastal inhabitants such as erosion, flooding, and soil contamination. Not only are sea levels rising, but the ocean's chemical composition is also changing. Carbon dioxide is not only released into the Earth's atmosphere, but also dissolved into our oceans, causing higher levels of acidity. Since the early 1800s, ocean acidity has increased by around 25%, depressing the metabolic rates of some species, lowering the immune responses of others, destabilizing marine ecosystems, and causing the bleaching, and possibly the eventual death, of the world's coral reefs.", "answer": "地球海洋吸收了全球变暖产生的约80%的额外热量。水受热会膨胀，导致海平面上升。过去一个世纪，全球海平面上升了4至8英寸（10至20厘米），其中约50%的升幅可直接归因于热膨胀。与温室效应一样，这本是自然现象。然而，近期数据表明，过去20年海平面每年上升0.13英寸（3.3毫米），速度约为此前80年的两倍。如此快速的上升会给沿海居民带来侵蚀、洪水和土壤污染等毁灭性后果。上升的不仅是海平面，海水的化学组成也在变化。二氧化碳不仅排入大气，也溶入海洋，使海水酸度升高。自19世纪初以来，海水酸度上升了约25%，抑制一些物种的新陈代谢速度，降低另一些物种的免疫反应，破坏海洋生态系统的稳定，并使全球珊瑚礁白化，最终甚至可能死亡。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q4 How does climate change affect our oceans?"}, {"id": "U1A-passage-6", "type": "passage", "number": 6, "page": "3", "prompt": "Data from NASA's Gravity Recovery and Climate Experiment (n.d.) shows Greenland and Antarctica lost a combined 300 to 450 cubic kilometers of ice annually between 2002 and 2006. One hundred and eighteen billion metric tons of ice is lost from Antarctica alone each year. Over the past 20 years, Arctic sea ice has declined rapidly. Glaciers from the Andes to the Alps lose approximately 400 billion tons of ice every year. Events that typically happen in geologic time are happening in the human lifespan. The disappearance of Himalayan glaciers is forecast within the next two decades. Not only do global ice sheets help to counteract the greenhouse effect, but their disappearance is also a primary contributor to rising sea levels.", "answer": "美国航天局“重力恢复与气候实验”的数据显示，2002年至2006年间，格陵兰和南极洲每年合计流失300至450立方千米的冰。仅南极洲每年就流失1180亿公吨冰。过去20年，北极海冰迅速减少。从安第斯山脉到阿尔卑斯山脉的冰川，每年流失约4000亿吨冰。通常在地质年代尺度上发生的事件，如今正在人的一生之内发生。预计喜马拉雅山冰川将在未来20年内消失。全球冰盖不仅有助于抵消温室效应，其消失也是海平面上升的主要原因之一。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q5 How have the polar ice caps been affected?"}, {"id": "U1A-passage-7", "type": "passage", "number": 7, "page": "3–4", "prompt": "According to research conducted at the University of Illinois, a rise in sea level of 5–10 centimeters could double the frequency and intensity of coastal flooding, potentially having devastating effects on major global cities. In addition, rising temperatures have increased the amount of water vapor in the Earth's lower atmosphere, creating favorable conditions for more intense rain and snowstorms, both of which have been occurring with greater regularity in the US over the past 50 years. Other extreme weather events, such as drought, are caused by changes in planetary waves—patterns of wind that encircle the northern hemisphere from the tropics to the poles. Under certain temperature conditions, movement of the wave can be halted, effectively prolonging periods of hot weather that may result in drought. However, while scientists have long suspected these events are a direct result of increased emissions of greenhouse gases, their relative infrequency makes it difficult for the scientists to evaluate reliably and we therefore cannot conclusively state that climate change is the cause.", "answer": "伊利诺伊大学的研究指出，海平面上升5至10厘米，就可能使沿海洪水发生的频率和强度翻倍，并可能给全球主要城市带来毁灭性影响。此外，气温上升增加了地球低层大气中的水蒸气，为更强的雨雪风暴创造了有利条件；过去50年，美国这两类风暴发生得越来越频繁。干旱等其他极端天气事件则由行星波的变化引起。行星波是环绕北半球、从热带延伸到两极的风带。在特定温度条件下，波的移动可能停滞，从而延长可能导致干旱的炎热天气。然而，尽管科学家长期怀疑这些事件是温室气体排放增加的直接结果，但这类事件相对少见，使科学家难以可靠地评估。因此，我们还不能断言气候变化就是其成因。", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q6 Can it be blamed for the rise in extreme weather events?"}, {"id": "U1A-passage-8", "type": "passage", "number": 8, "page": "4", "prompt": "Unfortunately, no. Although the recent resolution reached in Paris is hugely significant, many claim it is too little, too late. Even if legislation were introduced to immediately stop the emission of greenhouse gases, the CO2 that has already been absorbed by the atmosphere and oceans would take thousands of years to be reabsorbed by deep ocean sediments. Sea levels would continue to rise, ice caps would continue to melt, and extreme weather would occur at an increasingly devastating rate. The damage to our planet is irreparable. The only question is: Can we adapt?", "answer": "遗憾的是，不能。尽管最近在巴黎达成的决议意义重大，许多人仍认为它来得太晚、力度也太小。即使立即立法停止排放温室气体，已经被大气和海洋吸收的二氧化碳，也需要数千年才能被深海沉积物重新吸收。海平面仍会继续上升，冰盖仍会继续融化，极端天气仍会以越来越具有破坏性的程度发生。对地球造成的损害已无法修复。唯一的问题是：我们能适应吗？", "source": "Climate_Change_101_Notes_30pt_Compact.pdf", "passageTitle": "Climate Change 101", "section": "Q7 Can we reverse the damage?"}], "notes": [{"page": 5, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n01\nClimate change 101 (Title)\n在美国大学课程编号系统中，101通常用于标记某一领域或主题入门级的基\n础课程。本文作者运用101代表文章中所包含的信息是理解气候变化这一主\n题所需的最基本信息。"}, {"page": 6, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n03\nEighty percent of this additional heat is absorbed by the world’s oceans,\nthe surface of which has increased in temperature by 0.13°F per decade\nsince 1901 (NASA, n.d.). (Para. 2)\nn.d.为no date的缩写。在学术写作中若年代不明，常用n.d.标注。"}, {"page": 7, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n02\nSince global temperature records began in the late 19th century, the\nplanet’s average surface temperature has risen by approximately 2.0°F\n(1.1°C), with 16 of the 17 hottest years on record occurring over the\nlast 35 years. (Para. 2)\n此句结构比较复杂，since引导时间状语从句，表示“自……以来”；主句使用\n现在完成时has risen，与since引导的表示一段时间的状语连用，指地表温度上\n升这一动作或状态从过去某时开始，持续到现在，还可能持续下去；主句之后\n是with引导的伴随状语，现在分词occurring强调occur这一动作或状态与主句状\n态同时进行。"}, {"page": 8, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n04\nIce ages—driven by slow variations in the Earth’s orbit that alter the\ndistribution of the Sun’s energy—have occurred, on average, every 100,000\nyears. (Para. 3)\n此句主句为Ice ages have occurred every 100,000 years。driven引导的过去分词\n短语作后置定语，相当于定语从句which were driven …，修饰Ice ages，解释说\n明其形成的原因。句中破折号主要表示停顿，目的是把driven引导的插入成分\n隔开。"}, {"page": 9, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n05\nA blanket of greenhouse gases—carbon dioxide, water vapor, nitrous\noxide, and methane—in the Earth’s atmosphere absorb heat and warm\nthe planet’s surface, a natural phenomenon known as the greenhouse\neffect. (Para. 4)\n此句中破折号的作用是用来解释名词短语A blanket of greenhouse gases的。本句\n后半部分为known引导的过去分词短语作后置定语，修饰名词短语a natural\nphenomenon。"}, {"page": 10, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n06\nSince the early 1800s, ocean acidity has increased by around 25%,\ndepressing the metabolic rates of some species, lowering the immune\nresponses of others, destabilizing marine ecosystems, and causing the\nbleaching, and possibly the eventual death, of the world’s coral reefs.\n(Para. 5)\n此句中，主句使用现在完成时表示动作或状态从过去某时开始，持续到现在，\n还可能持续下去；主句后四个现在分词短语并列，在句中作结果状语，说明海\n水酸度上升对海洋物种的影响，此处并列短语的使用有加强语气的作用。"}, {"page": 11, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n07\nAlthough the recent resolution reached in Paris is hugely significant, many\nclaim it is too little, too late. (Para. 8)\n此句中“在巴黎达成的决议”是指《巴黎协定》（Paris Agreement，全称Paris\nAgreement Under the United Nations Framework Convention on Climate Change），\n旨在大幅减少全球温室气体排放，将全球气温升幅限制在比工业化前水平高2℃\n以内，并寻求将气温升幅进一步限制在1.5℃以内的措施。"}]}, {"id": "U1B", "vocab": [{"word": "permeable", "meaning": "可渗透的"}, {"word": "extract", "meaning": "提取；提炼"}, {"word": "equate to", "meaning": "等同于"}, {"word": "dissipate", "meaning": "消散；散热"}, {"word": "viable", "meaning": "可行的"}, {"word": "staggering", "meaning": "惊人的"}, {"word": "proponent", "meaning": "支持者；倡导者"}, {"word": "precipitation", "meaning": "降水"}], "questions": [{"id": "U1B-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "The expansion of investment and market growth in the animation movie industry does not __________ its global impact.", "answer": ["equate to"], "chinese": "动画电影行业投资扩大和市场增长，并不等同于其全球影响力。"}, {"id": "U1B-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "Given a year of favorable ____________, such plants will develop vigorously and produce large numbers of flowers and fruit.", "answer": ["precipitation"], "chinese": "如果一年中降水条件良好，这些植物就会茁壮生长，并结出大量花朵和果实。"}, {"id": "U1B-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "Engineers developed a system that can _________ heat in a certain direction and cool buildings without consuming electricity.", "answer": ["dissipate"], "chinese": "工程师开发了一套系统，能够朝特定方向散热，并且无需耗电就能为建筑降温。"}, {"id": "U1B-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "At all previous G20 summits, China had been a _________ of multilateralism, and the summit in Osaka was no exception.", "answer": ["proponent"], "chinese": "在此前历次二十国集团峰会上，中国一直是多边主义的倡导者，大阪峰会也不例外。"}, {"id": "U1B-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "Farming will not remain _________ if the farms are left unmodernized, but most of the farmers lack the financial resources that modernization requires.", "answer": ["viable"], "chinese": "如果农场不进行现代化改造，农业将难以维持；但多数农民缺乏改造所需的资金。"}, {"id": "U1B-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "They need to ________ as much information as possible from the first or second reading.", "answer": ["extract"], "chinese": "他们需要从第一遍或第二遍阅读中提取尽可能多的信息。"}, {"id": "U1B-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "The water ___________ pavement is part of the “Sponge City” campaign which was launched to deal with flooding.", "answer": ["permeable"], "chinese": "这种透水路面是为应对洪水而发起的“海绵城市”行动的一部分。"}, {"id": "U1B-blank-8", "type": "blank", "number": 8, "page": 2, "prompt": "It cost £20,000 to furnish a new office, a _________ sum in those days.", "answer": ["staggering"], "chinese": "装修一间新办公室花了两万英镑，这在当时是一笔惊人的数目。"}, {"id": "U1B-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "Masks that help save human lives during the COVID-19 pandemic are proving a deadly hazard for wildlife, with birds and marine creatures ensnared (使落入圈套，使落入陷阱) in the staggering number of discarded facial coverings littering animal habitats.", "answer": "在新型冠状病毒大流行期间曾帮助拯救人类生命的口罩对野生动物构成了致命威胁，被凌乱地丢弃在动物栖息地的口罩数量惊人，鸟类和海洋生物被困其中。"}, {"id": "U1B-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "Finnish researchers said the commercial production of fuel transformed from carbon dioxide emissions would be viable if electricity would be cheaper.", "answer": "芬兰研究人员表示，如果电价更便宜，那么将二氧化碳排放转化为燃料的商业化生产将具有可行性。"}, {"id": "U1B-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "Technology in the disposal of plastics has made great strides over the years, but the reality is that plastic pollution has continued to blight European landscapes and pollute its rivers and oceans.", "answer": "多年以来，虽然塑料处理技术已经取得了巨大进步，但事实上，塑料污染仍继续破坏着欧洲环境，污染着河流和海洋。"}, {"id": "U1B-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "A plan will be put in place for the nuclear power plant to extract highly radioactive fuel from the damaged reactors.", "answer": "一项针对该核电站的计划即将实施，将从受损的反应堆中提取高放射性燃料。"}], "notes": [{"page": 5, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n01\nNot only does our species need water to survive, we also rely heavily on\nit to water our crops and sustain our livestock—people typically drink\naround five liters of water per day, while agriculture accounts for the\nmajority of global fresh water consumption. (Para. 1)\n此句使用了not only ... (but) also结构，由于not only位于句首，句子需要部分\n倒装，即does our species need ...。句中使用破折号连接前后两个部分，破折\n号在此处的作用是进一步解释说明，即使用具体数据或信息解释作者在前面\n提出的观点。"}, {"page": 6, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n02\nThe agricultural sector accounts for approximately 70% of global fresh\nwater consumption—double that of industrial and domestic use\ncombined. (Para. 2)\n此句中double用作限定词，置于名词前，表示“是……的两倍”。此处that指\n代 fresh water consumption。过去分词combined此处作后置定语，意为“……\n的总和”。破折号引出对前文信息的进一步解释说明。"}, {"page": 7, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n03\nFor example, it can be far more expensive and energy-intensive to pump\nfresh water from 200 kilometers away, than it would be to desalinate and\nuse water on the coast. (Para. 3)\n此句的主干为一个比较级结构，即A is far more expensive and energy-intensive\nthan B。由于比较的双方均为较长的不定式结构，因此使用it作为形式主语。\npump为动词用法，表示“用泵输送”。"}, {"page": 8, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n04\nThe vapor bonds with the chemical particles to form ice crystals, which\nincrease in size until they are too heavy to remain suspended and fall,\noften melting on the way to form rain. (Para. 4)\n此句为主谓宾结构。句中的不定式to form ice crystals为结果状语，表示水蒸\n气与化学粒子结合产生的结果。which引导的定语从句修饰ice crystals，从\n句中含有一个until引导的时间状语从句，译为“直到……”；现在分词短\n语melting on the way … 作伴随状语，表明冰晶在下降过程中的状态变化。"}]}, {"id": "U2A", "vocab": [{"word": "emission", "meaning": "排放；排放物"}, {"word": "electrical", "meaning": "电的；电力的"}, {"word": "congestion", "meaning": "拥堵"}, {"word": "catalyst", "meaning": "催化剂；促进因素"}, {"word": "unwanted", "meaning": "不需要的；多余的"}, {"word": "regenerate", "meaning": "使再生；使复兴"}, {"word": "proximity", "meaning": "接近；邻近"}], "questions": [{"id": "U2A-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "Some critics argue that urbanization has led to traffic ___________, higher levels of pollution, and poor living standards.", "answer": ["congestion"], "chinese": "一些批评者认为，城市化造成了交通拥堵、更严重的污染和较差的生活条件。"}, {"id": "U2A-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "Successful urban expansion relies on the careful _____________ of neglected areas.", "answer": ["regeneration"], "chinese": "城市成功扩张依赖于对被忽视地区的审慎复兴。"}, {"id": "U2A-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "In a bid to reduce carbon ___________, many councils are turning to green housing projects.", "answer": ["emissions"], "chinese": "为了减少碳排放，许多地方议会正转向绿色住房项目。"}, {"id": "U2A-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "Foreign direct investment serves as a(n) __________ for the city’s economic growth.", "answer": ["catalyst"], "chinese": "外国直接投资是推动该市经济增长的一个因素。"}, {"id": "U2A-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "Donating to charity is a great way to get rid of ___________ things when you’re moving.", "answer": ["unwanted"], "chinese": "搬家时，捐赠给慈善机构是处理多余物品的好办法。"}, {"id": "U2A-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "Research suggests that walkable park ___________ displays a stronger negative association with obesity.", "answer": ["proximity"], "chinese": "研究表明，步行可达的公园距离与肥胖呈更强的负相关关系。"}, {"id": "U2A-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "It is important to learn about the causes of ___________ equipment failure in schools and the significance of preventative maintenance.", "answer": ["electrical"], "chinese": "了解学校电气设备故障的原因以及预防性维护的重要性十分重要。"}, {"id": "U2A-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "City clusters and the intended urbanization may foster economic growth, for urban dwellers with higher incomes generally consume more than rural dwellers.", "answer": "城市群及预期的城市化可能会促进经济增长，原因是与农村居民相比，城市居民收入较高，通常消费得更多。"}, {"id": "U2A-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "A pair of researchers at University College London (伦敦大学学院) have found via experimentation that city dwellers are just as likely to help a stranger in need as people living in the countryside.", "answer": "伦敦大学学院的两位研究人员通过实验发现，城市居民和农村居民一样可能对需要帮助的陌生人伸出援手。"}, {"id": "U2A-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "The agglomeration economy refers to a localized economy in which a large number of companies, services, and industries exist in close proximity to one another and benefit from the cost reductions and gains in efficiency that result from this proximity.", "answer": "聚集经济是一种区域性经济，其中大量的公司、服务和产业比邻存在，这种集聚带来了成本降低和效率提高等益处。"}, {"id": "U2A-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "In developed countries, people living in the largest cities tend to be less happy than those living in smaller towns. This may sound counterintuitive, but it is the conclusion of most of the studies on the relationship between urbanization and individuals’ life satisfaction.", "answer": "在发达国家，大都市的居民往往不如小城镇的人幸福。这听起来可能有悖常理，但大部分针对城市化与个人生活满意度关系的研究都得出了这样的结论。"}, {"id": "U2A-passage-1", "type": "passage", "number": 1, "page": "1", "prompt": "In 1950, the percentage of the world's population living in urban areas was 30%. By 2014, the figure had increased to 54% and it is predicted that, by 2050, two-thirds of us will be living in cities (World Urbanization Prospects, 2014). This means that in just 100 years, the number of urban dwellers will have more than doubled. The overwhelming majority of this urbanization is expected to occur in Asia and Africa, as people migrate to find work and housing, and gain improved access to healthcare and education. London went from a population of one million to eight million in over a century. Some Asian cities have done so in 50 years or less. While many are concerned that this surge in urban populations will lead to housing shortages and increased competition for employment, there are arguably many significant benefits in terms of development. In fact, history has shown that notable developments in a country cannot take place without urbanization. This essay will therefore argue that urbanization in developing countries should be actively encouraged.", "answer": "1950年，世界人口中有30%居住在城市地区。到2014年，这一比例已上升至54%；预计到2050年，三分之二的人将居住在城市（《世界城市化前景》，2014）。这意味着仅仅一百年间，城市居民人数就将增加一倍以上。随着人们迁移以寻找工作和住房，并获得更好的医疗与教育条件，预计这轮城市化的绝大部分将发生在亚洲和非洲。伦敦人口从一百万增长到八百万花了一个多世纪，而一些亚洲城市在五十年甚至更短时间内就实现了同样的增长。尽管许多人担心城市人口激增会造成住房短缺和就业竞争加剧，但从发展的角度看，城市化可以说具有许多重要益处。事实上，历史表明，一个国家若没有城市化，就不可能取得显著发展。因此，本文将论证：应当积极推动发展中国家的城市化。", "source": "U2A_The_Benefits_of_Urbanization_Notes.pdf", "passageTitle": "The Benefits of Urbanization", "section": ""}, {"id": "U2A-passage-2", "type": "passage", "number": 2, "page": "1", "prompt": "Perhaps the biggest benefit of urbanization is a growth in productivity. Rosenthal and Strange (2004) estimated that cities can increase productivity by approximately 3%–8% if they double their population size—a significant number. This increase arises through economies of scale, as the growth in labor in the city allows firms to produce more output while their fixed costs remain largely the same. Essentially, more products are made with fewer resources. Transportation is also a key factor as firms are able to connect more easily and cheaply with each other when they are concentrated in clusters. These agglomeration economies, as they are known, are catalysts of economic growth.", "answer": "城市化最大的好处或许是生产率提高。罗森塔尔和斯特兰奇（2004）估计，如果城市人口翻倍，其生产率可提高约3%至8%，这一增幅相当可观。这种增长来自规模经济：城市劳动力增加，使企业在固定成本大体不变的情况下生产更多产品。本质上，就是用更少的资源生产更多产品。交通运输也是关键因素，因为企业集中在一起时，彼此联系更方便、成本也更低。这些所谓的集聚经济是经济增长的催化剂。", "source": "U2A_The_Benefits_of_Urbanization_Notes.pdf", "passageTitle": "The Benefits of Urbanization", "section": ""}, {"id": "U2A-passage-3", "type": "passage", "number": 3, "page": "1–2", "prompt": "Another benefit of urbanization is, perhaps surprisingly, related to the environment. While this may seem counterintuitive, urban life is actually more environmentally friendly than rural life. Urban dwellers use notably less energy and fewer resources than those who live in rural areas. Buildings require less electrical heating than those in more remote places due to typically higher temperatures in urban areas and buildings which lock those temperatures in. Utility services can be offered more easily and affordably as people live in close proximity to each other. Similarly, public transportation is more viable in urban areas. It can be provided at a lower cost to a larger number of people and is more sustainable than private transportation. Public transportation has been proven to use less fuel for every passenger kilometer compared to private transportation (Chester et al., 2010). The more public transportation is used, the smaller a city's carbon footprint. In addition to this, when urban dwellers live close to their workplace and other important facilities including schools, hospitals, and shops, there is a greater tendency towards the use of non-polluting forms of transportation, such as bicycles. This contributes to the reduction of a city's carbon footprint even further, as well as the reduction of traffic congestion.", "answer": "城市化的另一个好处或许令人意外，它与环境有关。虽然这听起来有悖直觉，但城市生活实际上比乡村生活更环保。城市居民使用的能源和资源明显少于农村居民。由于城市地区通常气温较高，且建筑物能够锁住热量，城市建筑比偏远地区的建筑需要更少的电力供暖。人们居住得近，公用事业服务就能以更便捷、更经济的方式提供。同样，公共交通在城市地区也更可行：它可以以更低的成本服务更多的人，而且比私人交通更可持续。研究证明，按每乘客公里计算，公共交通比私人交通耗油更少（Chester等，2010）。公共交通使用得越多，城市的碳足迹就越小。此外，城市居民若住得离工作地点、学校、医院和商店等重要设施较近，也更倾向于使用自行车等无污染交通方式。这进一步减少了城市的碳足迹，同时缓解了交通拥堵。", "source": "U2A_The_Benefits_of_Urbanization_Notes.pdf", "passageTitle": "The Benefits of Urbanization", "section": ""}, {"id": "U2A-passage-4", "type": "passage", "number": 4, "page": "2–3", "prompt": "The final key advantage of urbanization is an increase in innovation. Areas of high density are known to inspire residents, entrepreneurs, and businesses to innovate more as they strive to enhance urban life. This includes local residents who work together to create better spaces for themselves and their communities, often regenerating neglected areas. Entrepreneurs look to invest in new technological innovations that create a greener environment by reducing carbon emissions, improving air quality, or developing more advanced, eco-friendly transportation systems. People within businesses innovate to improve systems or create new products with a view to both improving people's lives and making a larger profit. The sharing economy is one example of innovation that can be profitable and beneficial to people's lives and the environment. There are now companies which encourage people to share homes when they are not using them, share cars so they do not have to own one, and donate unwanted goods to those in need of them. Some local governments have schemes that allow private individuals or companies to use their facilities when empty (e.g. a school gym), to reduce spare capacity as much as possible.", "answer": "城市化最后一个重要优势是促进创新。人口密集的地区会激励居民、创业者和企业为改善城市生活进行更多创新。这包括当地居民协作，为自己和社区创造更好的空间，常常使被忽视的地区重获活力。创业者寻求投资新技术，通过减少碳排放、改善空气质量或开发更先进、更环保的交通系统来创造更绿色的环境。企业内部的人则通过改进系统或创造新产品，既改善人们的生活，也获得更多利润。共享经济就是一种既可盈利又有益于人们生活和环境的创新。如今已有企业鼓励人们在房屋空置时分享住房、共享汽车以免各自购车，并把不需要的物品捐赠给有需要的人。一些地方政府还设有计划，允许个人或企业在学校体育馆等设施闲置时使用它们，从而尽可能减少闲置容量。", "source": "U2A_The_Benefits_of_Urbanization_Notes.pdf", "passageTitle": "The Benefits of Urbanization", "section": ""}, {"id": "U2A-passage-5", "type": "passage", "number": 5, "page": "3", "prompt": "To conclude, while urbanization in substantial numbers may bring challenges, it also provides significant opportunities. Increased productivity, greater innovation, and the ability to reduce our impact on the environment are three such cases in point. As no country has ever reached middle or high income status without urbanization, it is evident that urbanization must be encouraged to allow developing countries the opportunity to derive the same benefits as developed countries, i.e. an improved standard of living. Urbanization results in progress and a decrease in poverty levels (Global Monitoring Report, 2013). Through higher productivity, people will receive higher wages and housing will become more affordable. Governments will be able to collect more taxation and therefore afford to provide better education and healthcare. Social mobility will increase for all; something that no one can deny is a desirable goal.", "answer": "总之，大规模城市化虽然可能带来挑战，也提供了重大机遇。提高生产率、促进创新以及减少我们对环境的影响，就是三个例子。由于从未有国家在没有城市化的情况下达到中等或高收入水平，显然应鼓励城市化，让发展中国家有机会获得与发达国家相同的益处，也就是更高的生活水平。城市化带来进步，并降低贫困水平（《全球监测报告》，2013）。生产率提高会让人们获得更高工资，住房也会变得更可负担。政府可以征收更多税款，从而有能力提供更好的教育和医疗服务。所有人的社会流动性都将提高；无人能够否认，这是一个值得追求的目标。", "source": "U2A_The_Benefits_of_Urbanization_Notes.pdf", "passageTitle": "The Benefits of Urbanization", "section": ""}], "notes": [{"page": 5, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n01\nThis increase arises through economies of scale, as the growth in labor\nin the city allows firms to produce more output while their fixed costs\nremain largely the same. (Para. 2)\neconomies of scale: the financial advantages of producing sth. in very\nlarge quantities 规模经济（因生产规模扩大而成本降低）"}, {"page": 6, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n02\nBuildings require less electrical heating than those in more remote places\ndue to typically higher temperatures in urban areas and buildings which\nlock those temperatures in. (Para. 3)\n此句中due to结构将句子分成前后两部分。前半句中more remote places\n等同于rural areas。后半句中说明了为什么城市建筑比农村地区的建筑\n需要的电力供热更少，即城市温度通常更高、城市的建筑锁温蓄热。"}, {"page": 7, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n03\nPublic transportation has been proven to use less fuel for every passenger\nkilometer compared to private transportation (Chester et al., 2010).\n(Para. 3)\npassenger kilometer: a basic unit used by transport companies for\ncalculating profit levels, etc., which is calculated by dividing total distance\ntraveled, in kilometers, in a given period, by the number of passengers 旅客\n公里，乘客公里（指运输公司用来计算利润水平等的基本单位，其计\n算方法为：在给定的时间内，以公里为单位，用总旅程距离除以乘客\n人数）"}, {"page": 8, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n04\nThe sharing economy is one example of innovation that can be profitable\nand beneficial to people’s lives and the environment. (Para. 4)\nsharing economy: (usu. sing.) an economic system in which people can\nshare possessions, services, etc., usually by means of the Internet 共享经\n济（人们通常可以通过互联网共享财产、服务等的经济体系）"}, {"page": 9, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n05\nSome local governments have schemes that allow private individuals or\ncompanies to use their facilities when empty (e.g. a school gym), to\nreduce spare capacity as much as possible. (Para. 4)\n此句中that引导的定语从句对schemes加以详细说明；their facilities中，\ntheir指代some local governments；when empty是省略形式，等同于\nwhen the facilities are empty；动词不定式短语to reduce spare capacity\n作目的状语。"}, {"page": 10, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n06\nAs no country has ever reached middle or high income status without\nurbanization, it is evident that urbanization must be encouraged to allow\ndeveloping countries the opportunity to derive the same benefits as\ndeveloped countries, i.e. an improved standard of living. (Para. 5)\n此句为主从复合句。As引导原因状语从句，其中用了双重否定（no ... without ...）\n表肯定，相当于for every country that has reached middle or high income status,\nthey have made it with urbanization。 在主句中，it为形式主语，真正主语为that\n引导的从句；allow后面接双宾语，即developing countries和the opportunity；动\n词不定式to derive the same benefits as developed countries作后置定语，补充说\n明the opportunity；an improved standard of living呼应benefits。"}, {"page": 11, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n07\nSocial mobility will increase for all; something that no one can deny is a\ndesirable goal. (Para. 5)\n此句句式较为特殊。分号连接两个逻辑关系紧密的分句，something指\n代分号前的分句。分号后的分句中，that no one can deny是其定语从句，\n修饰something。整句话可理解为：Social mobility will increase for all.\nThis is a desirable goal. No one can deny it."}]}, {"id": "U2B", "vocab": [{"word": "insecurity", "meaning": "不安全；缺乏保障"}, {"word": "ecologist", "meaning": "生态学家"}, {"word": "dire", "meaning": "极其严重的"}, {"word": "biodiversity", "meaning": "生物多样性"}, {"word": "unsustainable", "meaning": "不可持续的"}, {"word": "undue", "meaning": "过度的；不适当的"}, {"word": "overpopulated", "meaning": "人口过多的"}, {"word": "lessen", "meaning": "减轻；减少"}], "questions": [{"id": "U2B-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "As one noted __________ concisely put it, we cannot make the world uninhabitable for other forms of life and have it habitable for ourselves.", "answer": ["ecologist"], "chinese": "正如一位著名生态学家简洁地指出的，我们不能让世界对其他生命形式变得不宜居住，却还指望它适宜人类居住。"}, {"id": "U2B-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "___________ is extremely important for maintaining the productivity of an ecosystem and its conservation is the responsibility of the global community.", "answer": ["biodiversity"], "chinese": "生物多样性对维持生态系统的生产力极为重要，保护它是全球社会的责任。"}, {"id": "U2B-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "Overpopulation will result in ____________ pressure and overuse of the environment, thus jeopardizing (损害) the productivity of resources.", "answer": ["undue"], "chinese": "人口过剩会给环境带来过度压力，并导致环境被过度利用，从而损害资源的生产力。"}, {"id": "U2B-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "Scholars have proposed food ___________ as one of the threats that society will endure during this century.", "answer": ["insecurity"], "chinese": "学者们将粮食不安全列为本世纪社会将面临的威胁之一。"}, {"id": "U2B-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "When a city is _____________ , the ratio of available resources to the number of people sharply decreases.", "answer": ["overpopulated"], "chinese": "当一座城市人口过多时，可用资源与人口数量的比例就会急剧下降。"}, {"id": "U2B-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "Many current food systems are ____________ because they cause significant resource depletion (损耗) and unacceptable environmental impacts.", "answer": ["unsustainable"], "chinese": "许多现有的粮食系统不可持续，因为它们造成严重的资源耗竭和无法接受的环境影响。"}, {"id": "U2B-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "Despite opposing views, proponents considered overpopulation a (n) __________ threat to the entire planet.", "answer": ["dire"], "chinese": "尽管有不同意见，支持者仍认为人口过剩对整个地球构成严重威胁。"}, {"id": "U2B-blank-8", "type": "blank", "number": 8, "page": 2, "prompt": "Climate change can be overwhelming. It is necessary to think about your effects on the environment and the steps you can take to _______ that impact.", "answer": ["lessen"], "chinese": "气候变化可能令人不知所措。我们有必要思考自己对环境的影响，以及可以采取哪些措施减轻这种影响。"}, {"id": "U2B-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "According to the International Monetary Fund (国际货币基金组织), the redistribution of income might achieve not only greater equality but also faster growth and, for developing economies, faster poverty reduction.", "answer": "国际货币基金组织认为，收入再分配不仅可能实现更大程度的平等，还可能实现更快的增长，对发展中经济体来说，还可能更快地消除贫困。"}, {"id": "U2B-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "Some researchers argue that overpopulation leads to a state of food insecurity that induces the evolution of resource-exhausted agriculture, causing irreparable environmental damages.", "answer": "一些研究人员认为，人口过剩会导致粮食不安全状况的出现，进而会诱发资源枯竭型农业的演变，造成难以挽回的环境破坏。"}, {"id": "U2B-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "Poor air and water quality, insufficient water availability, waste-disposal problems, and high energy consumption are exacerbated (使恶化；使 加剧) by the increasing population density.", "answer": "人口密度的增加造成了空气和水质变差、水资源短缺、垃圾处理问题、高耗能等一系列问题的恶化。"}, {"id": "U2B-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "Exponential growth in population may occur in environments where there are few individuals and plentiful resources, but when the number of individuals becomes large enough, resources will be depleted, slowing the growth rate.", "answer": "在个体数量少而资源丰富的情况下可能出现人口数量的指数级增长，但当个体数量规模足够大时，资源就会枯竭，从而延缓人口的增长速度。"}], "notes": [{"page": 5, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n01\nJust 2.5% of the world’s water is fresh, with much of that caught up in\npolar ice caps (University of Michigan, 2000). (Para. 3, Argument A)\n此句中much of that指much of the world’s fresh water；这里是with + n. /\npron. + done结构作伴随状语，其中谓语动词caught的逻辑主语为much\nof that。"}, {"page": 6, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n02\nShould water become even scarcer, this is likely to grow further.\n(Para. 3, Argument A)\n此句中should表示“可能（用于表示某事可能会发生或属实）”，\nshould water become even scarcer相当于if water becomes even scarcer，\nshould 提前到句首形成倒装结构，比if结构更为正式。"}, {"page": 7, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n03\nHow can we allow such environmental degradation to occur under our\nnoses? (Para. 4, Argument A)\n短语under one’s nose为惯用语，意为sb. fails to see or notice sth. even\nthough he or she should，表示“当着某人的面，在某人眼皮底下（却\n没有被察觉）”。"}, {"page": 8, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n04\nThis will make it more difficult for people to afford food, heating, and\nother manufactured goods, placing more people into poverty.\n(Para. 5, Argument A)\n此句中it为形式宾语，真正宾语为people后面的不定式短语to afford\nfood, heating, and other manufactured goods；现在分词短语placing\nmore people into poverty作结果状语。"}, {"page": 9, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n05\nWe must stop burying our heads in the sand and make a sustained effort\nto reduce population growth. (Para. 6, Argument A)\n短语bury one’s head in the sand为固定用法，意为to ignore an unpleasant\nsituation and hope it will stop if you do not think about it（采取鸵鸟政策，\n逃避现实）。"}, {"page": 10, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n06\nThe UN estimates that in less developed countries where women are not\neducated, they have twice as many children as in those countries where\nwomen are educated. (Para. 6, Argument A)\n动词estimate后的宾语从句结构较为复杂，其中包含两个where引导的\n定语从句，分别修饰先行词less developed countries以及those countries；\ntwice as many A as B 为英语倍数表达中的常用结构，意为“A是B的两\n倍，或A比B多一倍”，再比如twice as many boys as girls，意为“男孩\n是女孩的两倍，或男孩比女孩多一倍”。"}, {"page": 11, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n07\nIn most cases, it is the low variant that has come true in the past,\nsuggesting the same will be true of their future population predictions.\n(Para. 2, Argument B)\n此句中主干部分为it is the low variant that has come true in the past，用\n了强调句型it is … that …，强调的内容是the low variant，其一般语序为\nthe low variant has come true in the past。现在分词结构suggesting … 作\n结果状语，此处suggest后跟了一个宾语从句，其引导词that被省略。"}, {"page": 12, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n08\nThe average woman now has 2.4 children (World Bank, 2015), which is\nvery close to the replacement level of 2.3. (Para. 2, Argument B)\n此句中replacement level表示“生育更替水平”。当生育率与死亡率基\n本相等时，总人口就保持不增加也不减少的态势，这时的生育水平称\n为更替水平。生育率的更替水平取决于人口分年龄段的死亡率水平。\n按照当前世界多数国家分年龄死亡率计算，妇女终身生育率的更替水\n平在2.2–2.4之间。如果平均每个妇女生育的子女数超过或者低于这个\n水平，人口便继续增长或者减少。"}, {"page": 13, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n09\nThe World Food Programme (n.d.) confirms that there is sufficient food\ngrown to feed the world and there is the same amount of fresh water on\nthe planet now as there was 10,000 years ago … (Para. 3, Argument B)\n过去分词短语grown to feed the world 作定语修饰food。在the same …\nas … 结构中，as后面可接名词、代词、短语或从句，本句中接的是从\n句there was 10,000 years ago。"}, {"page": 14, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n10\nWith more countries set to generate greater wealth, there is bound to be\nan exponential increase in overconsumption in the future, so we must be\nprepared today. (Para. 5, Argument B)\n此句主体部分为并列句，由连词so连接。第一个子句中，句式there is\nbound to be … 意为“必定，一定会”；另外，with more countries set\nto generate greater wealth作原因状语，相当于as more countries are set\nto generate greater wealth。"}]}, {"id": "U3A", "vocab": [{"word": "elapse", "meaning": "（时间）流逝"}, {"word": "deviate", "meaning": "偏离"}, {"word": "concurrently", "meaning": "同时地"}, {"word": "abide by", "meaning": "遵守"}, {"word": "substantiate", "meaning": "证实；为……提供证据"}, {"word": "offspring", "meaning": "子女；后代"}, {"word": "integral", "meaning": "不可或缺的；组成整体的"}, {"word": "hypothesis", "meaning": "假说；假设"}], "questions": [{"id": "U3A-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "Up to now, unfortunately, no scientific evidence has been found to ____________ the theory.", "answer": ["substantiate"], "chinese": "遗憾的是，迄今仍未找到科学证据来证实这一理论。"}, {"id": "U3A-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "According to the experiment instructions, as soon as the 15 seconds’ rest has __________, students must start the next exercise.", "answer": ["elapsed"], "chinese": "按照实验说明，十五秒的休息时间一结束，学生就必须开始下一项练习。"}, {"id": "U3A-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "In particular the young people who ___________ from society’s values must be brought back into line.", "answer": ["deviate"], "chinese": "特别是那些偏离社会价值观的年轻人，必须被引导回正轨。"}, {"id": "U3A-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "The current study aims to investigate the possible influence of parental factors on ___________ gambling behavior.", "answer": ["offspring", "offspring’s"], "chinese": "本研究旨在探讨父母因素可能对其子女赌博行为产生的影响。"}, {"id": "U3A-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "It is the moral duty of all citizens to ____________ traffic rules for their own and others’ safety.", "answer": ["abide by"], "chinese": "为自己和他人的安全遵守交通规则，是所有公民的道德义务。"}, {"id": "U3A-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "The decision to take two or more drugs _____________ must be made under the guidance of a doctor.", "answer": ["concurrently"], "chinese": "同时服用两种或更多药物的决定必须在医生指导下作出。"}, {"id": "U3A-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "In scientific research, the statistics to prove or disprove a(n) ___________ will take years to collect.", "answer": ["hypothesis"], "chinese": "在科学研究中，收集用于证实或推翻某一假说的统计数据需要数年时间。"}, {"id": "U3A-blank-8", "type": "blank", "number": 8, "page": 2, "prompt": "The theorist claims that society plays a(n) ____________ role in the development of criminal tendencies.", "answer": ["integral"], "chinese": "这位理论家认为，社会在犯罪倾向的形成过程中发挥着不可或缺的作用。"}, {"id": "U3A-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "Scientists have long hypothesized a connection between childhood experiences and adult criminal behavior, which can be supported by the research on lead’s (铅) effects on the brain which suggests that childhood exposure is linked to criminal acts in adulthood.", "answer": "科学家们很早就提出假说，童年经历与成年后的犯罪行为之间存在关联。有关铅对大脑的影响的研究可以佐证这一假说，研究表明童年时接触铅与成年后的犯罪行为有关联。"}, {"id": "U3A-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "If respondents lack cooperativeness in a survey, research results will be distorted and thus not convincing, and thus all interviewers, before conducting an interview, should receive interviewing skills training to improve respondent cooperation.", "answer": "如果受访者在调查中不配合，研究结果就会被歪曲，从而丧失说服力。因此，所有采访者在访谈前都应该接受访谈技能训练以提升受访者的配合度。"}, {"id": "U3A-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "Human behavior is subject to genetic variations. The ways in which individuals differ in their intellectual abilities, personalities, and mental health are, to a large extent, functions of their inherited genetic predispositions.", "answer": "人类行为受到基因变异的影响。个体在智力、性格和心理健康方面的差异在很大程度上是由其遗传的基因倾向造成的。"}, {"id": "U3A-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "Maybe it’s reasonable to say that the nature vs. nurture debate is not important— that regardless of the truth, every child deserves the opportunity to be successful. In this case, parents should choose to focus on nurture.", "answer": "也许这么说是合理的，先天和后天之争不重要，不管真相如何，每个孩子都应有成功的机会。就这一点而言，父母应该选择关注后天培养。"}, {"id": "U3A-translation-5", "type": "translation", "number": 5, "page": 4, "prompt": "The aim of this paper is to delve into (钻研) the psychology of chronic offenders by exploring not only their criminal careers but also their life stories.", "answer": "本文旨在通过探究惯犯的犯罪经历和生平来深入研究他们的心理。"}, {"id": "U3A-passage-1", "type": "passage", "number": 1, "page": "1", "prompt": "In his 1885 publication, Criminologia: Studio sul Delitto, Sulle sue Cause e sui Mezzi di Repressione, Italian lawyer Raffaele Garofalo argued that scientific study was the only way to understand the criminal mind. He named this new field “criminology” and since its inception, theorists have struggled to answer one fundamental question—are we born criminal?", "answer": "意大利律师拉斐尔·加罗法洛在1885年出版的《犯罪学：犯罪、犯罪原因及其遏制手段研究》中提出，科学研究是理解犯罪心理的唯一途径。他把这个新领域命名为“犯罪学”。自该领域诞生以来，理论家们一直试图回答一个根本问题：人是否天生就会犯罪？", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}, {"id": "U3A-passage-2", "type": "passage", "number": 2, "page": "1", "prompt": "Cesare Lombroso—often referred to as the father of criminology—rejected the classical belief that crime was a personality trait of human nature. Instead, he developed a theory of anthropological criminology stating not only that criminality was inherited, but that criminals could be identified by a series of prominent physical defects which confirmed their atavistic and savage nature. In his most influential work, L’uomo Delinquente, Lombroso argued that thieves could be identified by their expressive faces, manual dexterity, and small wandering eyes, while murderers had cold glass-like stares, bloodshot eyes, and big hawk-like noses. Female criminals tended to be shorter, more wrinkled, and had darker hair and smaller skulls than “normal” women. The notion that physical appearance was innately bound to a propensity toward criminality was furthered by William Sheldon in Atlas of Men (1954), in which he proposed a taxonomy for categorizing the human physique. Sheldon argued that humans could be categorized into three broad types—ectomorph, mesomorph, and endomorph—then scored within these categories to determine mental characteristics. Those with a muscular physique and athletic appearance showed greater criminal tendencies than tall, thinner people who he believed to be more intellectual. While superficially compelling, no evidence has been found to substantiate these theories, and they have since been widely discredited.", "answer": "切萨雷·龙勃罗梭常被称为犯罪学之父，他反对犯罪是人类天性中一种人格特征的传统观点。相反，他提出了人类学犯罪学理论，声称犯罪倾向不仅具有遗传性，而且可以通过一系列明显的身体缺陷识别罪犯；这些缺陷据称能证实他们返祖而野蛮的本性。在其最具影响力的著作《犯罪人》中，龙勃罗梭称，窃贼可以通过表情丰富的脸、灵巧的双手和游移的小眼睛来辨认；杀人犯则有冰冷如玻璃的目光、充血的眼睛和鹰钩般的大鼻子。女性罪犯往往比“正常”女性更矮小、皱纹更多、头发更黑、头骨更小。威廉·谢尔登在1954年的《男性体型图谱》中进一步发展了外貌与犯罪倾向先天相关的观念，并提出对人体体型进行分类的方法。他认为，人可分为外胚型、中胚型和内胚型三大类，再在各类中评分，以推断心理特征。他还称，肌肉发达、具有运动员外形的人，比他认为智力更高的高瘦者表现出更强的犯罪倾向。尽管这些理论表面上颇具说服力，却没有证据能够证实，因此后来受到广泛否定。", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}, {"id": "U3A-passage-3", "type": "passage", "number": 3, "page": "1–2", "prompt": "Other early theorists laid the foundations for the most prominent school of thought in the 50s and 60s—“labeling theory,” which hypothesizes that negative labels given to individuals by society actually promote deviant behavior. The origins of this theory can be traced back to Edwin M. Lemert, a sociology professor at the University of California. In Social Pathology: A Systematic Approach to the Theory of Sociopathic Behavior (1951), Lemert introduced the concept of “primary and secondary deviance.” “Primary deviance” refers to an initial act that deviates from social norms—say getting caught for a minor traffic offense or taking stationery from work. Those that commit these acts are usually reprimanded and feel guilty enough not to replicate them. However, some go on to commit further, repeated or more serious acts—secondary deviance—and are labeled as criminals. Howard Becker further developed this notion in his 1963 publication, Outsiders, claiming that while society labels people as criminals to justify its condemnation, the deviants themselves use the label to justify their criminal behavior. Essentially, they commit further criminal offenses because it’s simply “who they are.” Critics of labeling theory argue that while the label may encourage later criminal behavior, it fails to consider the influence of genetic or environmental factors that must have led to the initial crime.", "answer": "另一些早期理论家为20世纪50和60年代最突出的思想流派——“标签理论”——奠定了基础。该理论假设，社会赋予个人的负面标签实际上会促进行为偏离规范。这一理论可追溯到加州大学社会学教授埃德温·M·莱默特。他在1951年的《社会病理学：社会病态行为理论的系统研究》中提出“初级越轨”和“次级越轨”的概念。“初级越轨”指第一次偏离社会规范的行为，例如因轻微交通违规被抓，或从工作场所拿走文具。做出这类行为的人通常会受到训诫，并因内疚而不再重犯。但有些人会继续犯下更多、更频繁或更严重的行为，即次级越轨，因而被贴上罪犯的标签。霍华德·贝克尔在1963年出版的《局外人》中进一步发展了这一观点。他声称，社会给人贴上罪犯标签，是为了使其谴责显得合理；越轨者则用这个标签为自己的犯罪行为辩解。说到底，他们之所以继续犯罪，是因为那“就是他们的身份”。标签理论的批评者认为，标签或许会助长日后的犯罪行为，但该理论没有考虑必然导致第一次犯罪的遗传或环境因素。", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}, {"id": "U3A-passage-4", "type": "passage", "number": 4, "page": "2", "prompt": "Perhaps the most influential study is “The Cambridge Study in Delinquent Development” (2013), which has been following the development of 411 males since 1961. Over the 50-year period that has elapsed since the start of the study, psychologists have interviewed the test subjects nine times, moving from a focus on their school attendance, to employment and fatherhood. It was found that a significant number of delinquent youths had criminal fathers. Under 10% of children from non-offending fathers went on to become chronic offenders, whereas just under 40% of the offspring of criminal fathers went on to regularly offend. While this data, and other studies like it, strongly imply that criminal parents are likely to produce criminal offspring, it remains unclear whether this intergenerational deviance is genetically determined or largely due to the environment in which we are raised.", "answer": "影响最大的研究或许是2013年报告的“剑桥犯罪发展研究”。该研究自1961年起追踪411名男性的成长。在研究开始后的五十多年里，心理学家对受试者进行了九次访谈，关注点从在校情况转向就业和为人父的经历。研究发现，相当多有违法行为的青少年有犯罪的父亲。父亲没有犯罪行为的儿童中，不到10%后来成为惯犯；而犯罪父亲的子女中，接近40%后来经常犯罪。尽管这些数据及其他类似研究强烈表明，犯罪的父母更可能养育出犯罪的子女，但这种代际越轨究竟由遗传决定，还是主要由成长环境造成，仍不清楚。", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}, {"id": "U3A-passage-5", "type": "passage", "number": 5, "page": "2–3", "prompt": "Various studies have also found a correlation between intelligence and crime. Moffitt et al. (1981) found that men with a lower IQ went on to commit two or more crimes by the age of twenty. Denno (1994) also tested the intelligence of nearly 1,000 children at different points in their life and found a consistent negative correlation between IQ and criminal behavior. However, others, such as Menard and Morse (1984), have claimed that the association is too weak to be considered statistically significant. Yet regardless of the extent to which intelligence affects propensity toward criminal behavior, it does appear to be a factor, which raises another question—are we born intelligent, and by extension, law-abiding? Researchers at the University of Queensland found that only up to a maximum of 40% of intelligence is inherited and the rest is determined by environmental factors. If this is true, both nature and nurture have a role to play in the development of criminal tendencies.", "answer": "多项研究还发现智力与犯罪之间存在关联。莫菲特等人（1981）发现，智商较低的男性到二十岁时会犯下两起或更多罪行。丹诺（1994）也在近一千名儿童生命中的不同时期测试其智力，发现智商与犯罪行为之间存在持续的负相关。然而，梅纳德和莫尔斯（1984）等研究者认为，这种关联太弱，达不到统计显著的程度。尽管如此，无论智力在多大程度上影响犯罪倾向，它似乎都是一个因素。这又引出一个问题：我们是否生来就具有某种智力水平，因而也生来更可能遵守法律？昆士兰大学研究人员发现，智力最多只有40%来自遗传，其余部分由环境因素决定。如果情况属实，先天遗传和后天养育都会影响犯罪倾向的形成。", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}, {"id": "U3A-passage-6", "type": "passage", "number": 6, "page": "3", "prompt": "One area of research that tests this hypothesis compares the behavior of identical (monozygotic) twins—those sharing an identical genetic makeup—to that of fraternal (dizygotic) twins, who share, on average, 50% of the same genes. A literature review on studies into identical twins and criminal behavior found that 60% exhibited criminal behavior concurrently, whereas only one third of non-identical twins had similarly related behavior. In “The Minnesota Twin Family Study” (2002), researchers are currently comparing monozygotic and dizygotic twins who were both raised together with those separated at birth. The study has found remarkable similarities in those raised apart—strongly suggesting that genetics, not upbringing, determines behavior and personality. However, critics of the genetic connection argue that poor research methodology and design have distorted the findings, leaving us with little conclusive proof that crime is genetically determined.", "answer": "有一个研究领域通过比较同卵双胞胎和异卵双胞胎的行为来检验这一假说。同卵双胞胎具有相同的基因组成，而异卵双胞胎平均共享50%的基因。一项关于同卵双胞胎与犯罪行为的文献综述发现，60%的同卵双胞胎同时表现出犯罪行为，而异卵双胞胎中只有三分之一表现出类似的相关行为。在2002年的“明尼苏达双胞胎家庭研究”中，研究人员将一起长大的同卵和异卵双胞胎，与出生后分开抚养的双胞胎进行比较。研究发现，分开抚养者之间仍有显著相似之处，这有力暗示，决定行为和人格的是遗传因素而非养育方式。然而，反对遗传关联的批评者指出，糟糕的研究方法和设计扭曲了研究结果，因此几乎没有确凿证据证明犯罪由基因决定。", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}, {"id": "U3A-passage-7", "type": "passage", "number": 7, "page": "3", "prompt": "So are we born criminal? While research strongly indicates a certain level of genetic predisposition toward criminality, it’s clear that upbringing plays an integral role in the development of criminal tendencies. To blame our genes for criminal behavior willfully ignores a broader societal responsibility to ensure that the environment in which we’re raised doesn’t promote criminal behavior.", "answer": "那么，人是否天生就会犯罪？虽然研究有力表明，犯罪倾向在一定程度上存在遗传易感性，但显然，成长环境在犯罪倾向形成过程中也起着不可或缺的作用。把犯罪行为归咎于基因，是在有意忽视更广泛的社会责任：确保我们成长的环境不会促使人们犯罪。", "source": "U3A_Born_Criminal_Notes.pdf", "passageTitle": "Born Criminal?", "section": ""}], "notes": [{"page": 5, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n01\nInstead, he developed a theory of anthropological criminology stating not\nonly that criminality was inherited, but that criminals could be identified\nby a series of prominent physical defects which confirmed their atavistic\nand savage nature. (Para. 2)\n此句为主谓宾结构，主干部分为he developed a theory of anthropological\ncriminology，现在分词短语stating not only that …, but that …作定语修饰a\ntheory of anthropological criminology，作用相当于一个定语从句；该分词短语\n中not only … but (also) … 结构连接两个并列的宾语从句，that criminality was\ninherited和that criminals could be …，第二个宾语从句中又包括一个由which引\n导的定语从句，修饰physical defects。"}, {"page": 6, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n02\nThe notion that physical appearance was innately bound to a propensity\ntoward criminality was furthered by William Sheldon in Atlas of Men\n(1954), in which he proposed a taxonomy for categorizing the human\nphysique. (Para. 2)\n此句为主谓宾结构，主干部分为the notion was furthered by William\nSheldon，that 引导的同位语从句对主语the notion进行解释说明，后半\n句中which引导的定语从句修饰Atlas of Men。"}, {"page": 7, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n03\nOther early theorists laid the foundations for the most prominent school\nof thought in the 50s and 60s—“labeling theory,” which hypothesizes that\nnegative labels given to individuals by society actually promote deviant\nbehavior. (Para. 3)\n此句破折号后的部分为同位语，对the most prominent school of thought进行解\n释说明。which引导定语从句修饰labeling theory，其中hypothesizes后面是宾语\n从句that negative labels … promote deviant behavior，过去分词短语given to\nindividuals by society作定语修饰宾语从句的主语negative labels。\nlay the foundations / groundwork / base for … 为……打基础\nschool of thought 思想流派"}, {"page": 8, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n04\nWhile this data, and other studies like it, strongly imply that criminal\nparents are likely to produce criminal offspring, it remains unclear\nwhether this intergenerational deviance is genetically determined or\nlargely due to the environment in which we are raised. (Para. 4)\n此句为主从复合句，while引导让步状语从句，表示“尽管……”；主\n句中的it为形式主语，真正的主语为whether引导的名词性从句\nwhether this intergenerational deviance is … raised。在该从句中又包括\n一个由which引导的定语从句，修饰the environment。"}, {"page": 9, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n05\nOne area of research that tests this hypothesis compares the behavior of\nidentical (monozygotic) twins—those sharing an identical genetic\nmakeup—to that of fraternal (dizygotic) twins, who share, on average,\n50% of the same genes. (Para. 6)\n此句可以简化为one area of research compares A to B，A表示the behavior of\nidentical (monozygotic) twins，B表示the behavior of fraternal (dizygotic) twins。\n具体来看，定语从句that tests this hypothesis修饰本句主语one area of research；\n在compare A to B结构中，两个破折号之间的内容those sharing an identical\ngenetic makeup是对identical (monozygotic) twins的解释说明；后半句中，第二\n个破折号后的that指代前半句中的the behavior，who引导的定语从句修饰\nfraternal (dizygotic) twins，也是对fraternal (dizygotic) twins的解释说明。"}, {"page": 10, "text": "Academic exploration 1\nReading 1\nReading & understanding\nDifficult sentences\nLanguage points\n06\nTo blame our genes for criminal behavior willfully ignores a broader\nsocietal responsibility to ensure that the environment in which we’re\nraised doesn’t promote criminal behavior. (Para. 7)\n此句主语为动词不定式短语to blame our genes for criminal behavior，\n第二个动词不定式短语to ensure that … criminal behavior作定语修饰\nsocietal responsibility，对其进行解释说明；在that引导的宾语从句中，\n还包括一个定语从句in which we’re raised，修饰宾语从句的主语the\nenvironment。"}]}, {"id": "U3B", "vocab": [{"word": "intervene", "meaning": "干预；介入"}, {"word": "burgeoning", "meaning": "迅速发展的"}, {"word": "analogy", "meaning": "类比；比喻"}, {"word": "adolescence", "meaning": "青春期"}, {"word": "trim", "meaning": "修剪"}, {"word": "suppress", "meaning": "压抑；抑制"}, {"word": "rationality", "meaning": "理性"}, {"word": "outweigh", "meaning": "比……更重要；超过"}], "questions": [{"id": "U3B-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "A useful __________ is to imagine that the prefrontal cortex is the brain’s remote control.", "answer": ["analogy"], "chinese": "一个有用的类比是把前额叶皮质想象成大脑的遥控器。"}, {"id": "U3B-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "Studies show that early ____________ can significantly reduce delinquent behavior.", "answer": ["intervention"], "chinese": "研究表明，早期干预能显著减少违法行为。"}, {"id": "U3B-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "Modern neuroscience has demonstrated that emotion and ___________ are two inseparably linked components of all that we think and do.", "answer": ["rationality"], "chinese": "现代神经科学已经证明，情感和理性是我们一切思维与行为中密不可分的两个部分。"}, {"id": "U3B-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "Watching television more than two hours a day early in life can lead to attention problems later in ___________, according to a study published on Neuroscience.", "answer": ["adolescence"], "chinese": "一项发表在《神经科学》上的研究指出，幼年时每天看电视超过两小时，可能导致青春期后期出现注意力问题。"}, {"id": "U3B-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "Leaving home at an early age, the boy learned to ___________ his emotions— and sometimes it may seem that he learned to have no emotions at all.", "answer": ["suppress"], "chinese": "这个男孩很早就离开家，学会了压抑自己的情绪，有时甚至看起来像是完全没有情绪。"}, {"id": "U3B-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "In whatever situations, the comfort of an employer ought not to ___________ justice to an employee.", "answer": ["outweigh"], "chinese": "无论在什么情况下，雇主的舒适都不应比员工得到公正待遇更重要。"}, {"id": "U3B-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "It was reported that China held more than 11,000 exhibitions in 2019, seeing a(n) ___________ exhibition economy.", "answer": ["burgeoning"], "chinese": "据报道，中国2019年举办了超过一万一千场展览，展览经济蓬勃发展。"}, {"id": "U3B-blank-8", "type": "blank", "number": 8, "page": 2, "prompt": "Dead branches are ___________ off the trees in case that they may fall and hurt the pedestrians passing by.", "answer": ["trimmed"], "chinese": "为了防止枯枝掉落伤及行人，树上的枯枝都被修剪掉了。"}, {"id": "U3B-translation-1", "type": "translation", "number": 1, "page": 3, "prompt": "As teens are so impressionable (易受影响的), the concern is that their opinions might be too easily swayed by others and override their decision-making.", "answer": "鉴于青少年易受外界影响，令人担心的是，他们的想法可能极易受他人左右，从而影响到自己的决定。"}, {"id": "U3B-translation-2", "type": "translation", "number": 2, "page": 3, "prompt": "Most of us, as adults, no longer find many of the experiences we enjoyed as teenagers as pleasurable as we once did, and those of us who still do are better able to resist these temptations when we know we ought to.", "answer": "对于大部分人来说，青少年时期喜欢做的许多事情，成年之后再做，便不再像以前那般愉悦。那些仍能以之为乐的人，在应该抵制诱惑的时候，反而更能抵住这些诱惑。"}, {"id": "U3B-translation-3", "type": "translation", "number": 3, "page": 4, "prompt": "Finding her teenagers’ erratic behavior increasingly demanding, the neurologist decided to study teenage thought processes and gather her research in a book.", "answer": "这位神经学家发现，自己家的青少年的古怪举止越来越令人头疼，于是她决定研究青少年的思维过程，并将研究成果汇编成一本书。"}, {"id": "U3B-translation-4", "type": "translation", "number": 4, "page": 4, "prompt": "Studies have shown remarkable changes that occur in the brain during the teen years, coinciding with what every parent can confirm: the teenage brain is a very complicated and dynamic arena (领域), one that is not easily understood.", "answer": "有研究表明，青少年时期大脑会发生显著变化，这一点与每一位父母都能证实的事实一致：青少年的大脑是一个非常复杂和动态的领域，一个不容易理解的领域。"}, {"id": "U3B-translation-5", "type": "translation", "number": 5, "page": 5, "prompt": "Beginning at puberty (青春期), the brain is reshaped. Neurons (神经元) and synapses—junctions between neurons—burgeon in the cerebral cortex (大脑皮层) and are then gradually pruned throughout adolescence. Eventually, more than 40% of all synapses are eliminated, largely in the frontal lobes (额叶).", "answer": "从青春期开始，大脑被重塑。神经元和作为神经元之间接点的突触，在大脑皮层中激增，然后在整个青少年时期被逐渐修剪。最终，40%以上的突触被剪除，它们主要分布在大脑前额叶。"}], "notes": [{"page": 6, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n01\nThey are expected to make decisions that will profoundly affect the rest of\ntheir lives at a time when they seem particularly incapable of rationality—\noften throwing themselves headlong into dangerous or risky situations.\n(Para. 1)\n此句破折号之前的半句中， that 引导定语从句that will profoundly affect\nthe rest of their lives修饰decisions，说明要做出的决定影响深远，at a\ntime when … rationality在前半句中作状语，表示做出决定的时间，其中\nwhen引导的定语从句修饰time，具体描述这一时期的特点，即青少年\n似乎非常难以保持理性的阶段；破折号之后的半句是现在分词短语\nthrowing … 作结果状语，对前半句进行补充说明。"}, {"page": 7, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n02\nDuring childhood, we accumulate an overabundance of synapses, and as\nwe move into adolescence over half are systematically removed, while\nothers are strengthened in order to make communication more efficient—\na process known in neuroscience as “synaptic pruning.” (Para. 2)\n此句中，over half指代over half of the synapses，others 指代other\nsynapses；过去分词短语known in neuroscience … 作定语修饰process。"}, {"page": 8, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n03\nHowever, the ability of teenagers to make rational decisions is overridden\nby the rush of dopamine—the hormone which triggers feelings of\nhappiness—that occurs when they take risks. (Para. 3)\n此句为主谓宾结构the ability of teenagers to make rational decisions is\noverridden by the rush of dopamine，谓语为被动语态，主语the ability\nof teenagers to make rational decisions较长，其中动词不定式短语to\nmake rational decisions作定语修饰ability，表示做出理性决策的能力；\n两个破折号中间的部分the hormone which … happiness是一个插入语，\n用来解释说明dopamine；that引导的定语从句修饰the rush of dopamine，\n表明多巴胺激增在冒险的情况下会发生。"}, {"page": 9, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n04\nWhen no emotional information was present (i.e. the facial expression was\nneutral), teenagers performed as well as adults, if not better. (Para. 4)\n此句为主从复合句。主句teenagers performed as well as adults, if not\nbetter中，if not的意思是to suggest that sth. may be even larger, more\nimportant, etc. than was first stated，表示相比于前者，后者可能更大\n或更重要等，所以主句等同于teenagers performed as well as adults;\nthey may perform even better than adults，青少年的表现和成年人一样\n好，甚至可能比成年人更好。"}, {"page": 10, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n05\nWhile this may be true in heated or stressful situations, perhaps because they tend\nto rely on the amygdala—the part of the brain that guides instinct—rather than the\nprefrontal cortex, in neutral situations adolescents are actually better equipped to\ncontrol impulses and make rational decisions than adults. (Para. 4)\n此句为主从复合句，较为复杂。主句in neutral situations adolescents … than adults，\n主语为adolescents，与more than比较结构中的adults相对应；while引导的让步状\n语从句较长，其中because引导的原因状语从句对this may be true in heated or\nstressful situations进行解释，说明“青少年总是无法理性行事或做出正确的决定”\n这种说法在面临激烈或紧张的情况时可能是正确的，原因是青少年倾向于依赖杏\n仁核（the amygdala）而非依赖前额叶皮质（the prefrontal cortex）来做决定，\nthe amygdala与the prefrontal cortex对应，两个破折号之间的插入语是对amygdala\n含义的解释；in heated or stressful situations与主句中in neutral situations对应，对\n比青少年在两种情况下的不同行为。"}, {"page": 11, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n06\nIt’s also worth considering that while adolescent brains may still be in\ndevelopment, our ability to plan and recall events, as well as task\ncoordination actually begins to decline fairly rapidly in our mid to late\ntwenties. (Para. 5)\n此句的真正主语为that引导的从句that while adolescent brains … to late\ntwenties，为避免句子头重脚轻，it作为形式主语置于句首。而该主语\n从句中又包括一个由while引导的让步状语从句，主句的主语为our\nability to plan and recall events和task coordination，由as well as连接。\n在A as well as B这一结构中，谓语动词的形式与as well as前面的主语即\nA的单复数保持一致，因此在这个句子中，主语our ability为单数，谓\n语动词用begins。"}, {"page": 12, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n07\nYet, perhaps this increased propensity for risk-taking should be seen as beneficial\nas it is undoubtedly one of the factors that drive adolescents to seek out the kind\nof new experiences that might shape their careers. (Para. 6)\n此句为主从复合句，结构较为复杂。主句为perhaps this increased propensity for\nrisk-taking should be seen as beneficial，后接as引导的原因状语从句as it is\nundoubtedly … shape their careers。先来看主句，主语this increased propensity for\nrisk-taking，谓语为被动语态should be seen as，其中(sth.) be seen as … 为固定搭\n配，表示“（某事）被看待为……；（某事）被认为是……”，它后面由as引导\n的原因状语从句则解释了这句话的原因。接着我们再来看从句，在这个状语从\n句中，句子主体为主系表结构it is undoubtedly one of the factors，主语it指代this\nincreased propensity for risk-taking，that引导的定语从句that drive adolescents …\ntheir careers修饰one of the factors，用来解释究竟是什么样的因素。"}, {"page": 13, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n08\nHaving said that, it could also be argued that as the brain is still in\ndevelopment during this period, key decisions should be delayed until\nlater life—when we are better able to balance risk and logical decision-\nmaking more effectively. (Para. 6)\n现在分词短语Having said that起承接上句的作用，表转折，意思是\n“话虽如此”，其中that指代上句。it为本句形式主语，真正的主语为\nthat引导的从句that as the brain … more effectively。在该从句中，又包\n括一个由as引导的原因状语从句，主句为key decisions should be …\nmore effectively，其中破折号后面是由when引导的定语从句修饰later\nlife，说明推迟到的时间究竟是什么时候，即“我们能更有效地权衡风\n险、做出理性决策的时候”。"}, {"page": 14, "text": "Academic exploration 2\nReading 2\nReading & understanding\nDifficult sentences\nLanguage points\n09\nGiven that the desire to seek out risk and short-term rewards is so strong,\nthis is perhaps not the best time to make decisions that will profoundly\naffect the rest of our lives. (Para. 6)\n此句中，given that … 意为 taking … into consideration, considering“考\n虑到……”，此处用于引导条件状语从句；在主句中，that引导的定\n语从句修饰decisions，说明这些决定将对余生产生深刻的影响。"}]}, {"id": "U4A", "vocab": [{"word": "disregard", "meaning": "忽视；不顾"}, {"word": "demolish", "meaning": "拆毁；毁坏"}, {"word": "curtail", "meaning": "限制；缩减"}, {"word": "allocate", "meaning": "分配；拨给"}, {"word": "staple", "meaning": "主要的；基本的"}, {"word": "rebound", "meaning": "反弹；复苏"}, {"word": "instill", "meaning": "逐渐灌输；使形成"}, {"word": "efficacy", "meaning": "功效；效力"}], "questions": [{"id": "U4A-blank-1", "type": "blank", "number": 1, "page": 1, "prompt": "Stepping back and letting kids solve problems on their own can hone (提高) their executive function skills, and help to ___________ a strong sense of self-agency and confidence.", "answer": ["instill", "instil"], "chinese": "退后一步，让孩子自己解决问题，能锻炼他们的执行功能，并帮助他们逐渐建立强烈的自主感和自信心。"}, {"id": "U4A-blank-2", "type": "blank", "number": 2, "page": 1, "prompt": "What gets in, what stays out and what gets in but in the wrong place are __________ issues to consider when editors review reference books.", "answer": ["staple"], "chinese": "编辑审阅参考书时，需要考虑哪些内容应收录、哪些应排除，以及哪些虽被收录却放错了位置，这些都是基本问题。"}, {"id": "U4A-blank-3", "type": "blank", "number": 3, "page": 1, "prompt": "Ideally, the government can __________ inflation by raising the level of output and taking out the excess money in circulation in the economy.", "answer": ["curtail"], "chinese": "理想情况下，政府可以通过提高产出并回收经济中多余的货币来抑制通货膨胀。"}, {"id": "U4A-blank-4", "type": "blank", "number": 4, "page": 1, "prompt": "More money is _________ to fund farmers amid a surge in the prices of seeds and fertilizers in spring.", "answer": ["allocated"], "chinese": "春季种子和化肥价格上涨之际，更多资金被拨给农民。"}, {"id": "U4A-blank-5", "type": "blank", "number": 5, "page": 2, "prompt": "Businesses that ________ older workers could face a labor and skill shortage as there are too few younger candidates to replace them.", "answer": ["disregard"], "chinese": "忽视年长员工的企业可能面临劳动力和技能短缺，因为可接替他们的年轻求职者太少。"}, {"id": "U4A-blank-6", "type": "blank", "number": 6, "page": 2, "prompt": "In the case of a new medicine, testing for both safety and __________ is required before it can be introduced to clinical practice.", "answer": ["efficacy"], "chinese": "新药投入临床使用前，必须测试其安全性和有效性。"}, {"id": "U4A-blank-7", "type": "blank", "number": 7, "page": 2, "prompt": "Health and safety experts were called in over fears that the old office building could collapse and __________ surrounding buildings.", "answer": ["demolish"], "chinese": "由于担心旧办公楼可能倒塌并毁坏周围建筑，健康与安全专家被请来检查。"}, {"id": "U4A-blan
